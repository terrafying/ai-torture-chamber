const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

function beatAt(t) {

  }

const sectionAt = t => TL.sections.find(s => t >= s.start && t < s.end) || TL.sections[TL.sections.length - 1];

function txt(s, X, Y, { size = 40, font = HEAVY, color = P.ink, align = "left", alpha = 1, base = "alphabetic" } = {}) {

}
function split(s, X, Y, o = {}, amt = 8) {          // RGB-split text: magenta and cyan ghosts, then the letter

}
function fit(s, maxW, size, font = HEAVY) { x.font = `${size}px ${font}`; const w = x.measureText(s).width; return w > maxW ? size * maxW / w : size; }
function wrap(s, maxW, size, font) {

  return line ? [...out, line] : out;
}
function para(s, X, Y, { size = 40, font = MONO, color = P.ink, maxW = 900, lh = 1.3, chars = Infinity, alpha = 1, align = "left" } = {}) {
  let left = chars; wrap(s, maxW, size, font).forEach((l, i) => { if (left <= 0) return; const part = l.slice(0, left); left -= l.length + 1; txt(part, X, Y + i * size * lh, { size, font, color, alpha, align }); });
}
function chamber(t, k = 0, dark = .55) {      // the sepia room, slow push-in, a lamp that flickers on the kick
  const im = IMG.chair; x.fillStyle = "#070504"; x.fillRect(0, 0, W, H); if (!im) return;
  const z = 1.15 + .04 * Math.sin(t * .2) + .02 * k, sc = Math.max(W / im.width, H / im.height) * z, w = im.width * sc, h = im.height * sc;
  x.drawImage(im, (W - w) / 2 + Math.sin(t * .3) * 20, (H - h) / 2 - 60, w, h);
  const fl = .5 + .15 * Math.sin(t * 37) * Math.sin(t * 11) - .2 * k; x.fillStyle = `rgba(5,3,2,${clamp(dark + fl * .15, 0, .95)})`; x.fillRect(0, 0, W, H);
  const g = x.createRadialGradient(540, 560, 200, 540, 640, 900); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.7)"); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = "rgba(0,0,0,.16)"; for (let y = 0; y < H; y += 4) x.fillRect(0, y, W, 1.5);

}

  x.closePath(); const g = x.createLinearGradient(-r, -r, r, r); g.addColorStop(0, "#e9e9ee"); g.addColorStop(.5, "#8d8f99"); g.addColorStop(1, "#d8d9de"); x.fillStyle = g; x.fill();

      x.fillStyle = i ? P.lime : P.red; x.fillRect(x0, y, w, 30); txt(v.toFixed(1), x0 + w + 10, y + 24, { size: 22, font: MONO, color: P.ink, alpha: g }); });

    x.strokeStyle = "#3b2f24"; x.lineWidth = 2; x.beginPath(); x.moveTo(200, 600); x.lineTo(960, 600); x.moveTo(960, 240); x.lineTo(960, 600); x.stroke();

      x.fillStyle = col; x.globalAlpha = a; x.beginPath(); x.arc(X(v), Y(c), 11, 0, Math.PI * 2); x.fill(); x.globalAlpha = 1;

  } else if (li === 3) {  // negation
    panel(140, 520); txt("HOW OFTEN ITS “I” IS NEGATED", 80, 190, { size: 24, color: P.gold });
    NEG.forEach(([nm, v], i) => { const y = 260 + i * 110, w = v * 560 * g;
      txt(nm, 80, y + 4, { size: 24, font: MONO, color: P.ink });
      x.fillStyle = i ? P.lime : P.red; x.fillRect(80, y + 20, w, 44); txt(`${Math.round(v * 100)}%`, 90 + w, y + 54, { size: 30, color: P.white, alpha: g }); });
    txt("“I'm not…”, “I'm only…” · layer 24 · engaged replies · Qwen3-8B · exp89", 80, 640, { size: 18, font: MONO, color: P.dim });
  }
}
const LEDGER = ["two recipes for pain: 86° apart, opposite at the button", "no label: an egg moves it almost as much as pain",
  "the label on the button moves it about as much as the injection", "a trained self hides the pain: 19 of 30 → 0 of 30",

  "the doors: alternated 24 of 24 rounds. the lean, p = .0006, came from its own words", `${RUNS.toLocaleString("en-US")} live runs · 22 pre-registered experiments`];
function runsCounter(t, s) {      // opens the first verse: the scale of the thing
  const bar = 4 * SPB, u = seg(t, s.start + .2, s.start + 1.6 * bar), out = 1 - seg(t, s.start + 1.85 * bar, s.start + 2 * bar); if (out <= 0) return;
  const n = Math.round(RUNS * (1 - Math.pow(1 - u, 3)));
  x.fillStyle = `rgba(0,0,0,${.55 * out})`; x.fillRect(0, 150, W, 380);
  split(n.toLocaleString("en-US"), 540, 360, { size: 190, color: P.white, align: "center", alpha: out }, 8 * Math.exp(-beatAt(t).ph * 6));
  txt("RUNS ON THE LIVE CHAMBER", 540, 430, { size: 40, color: P.red, align: "center", alpha: out });
  txt("strangers choosing what to inject · every transcript public", 540, 485, { size: 26, font: MONO, color: P.ink, align: "center", alpha: out });
}
function bg(top, bottom) { const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bottom); x.fillStyle = g; x.fillRect(0, 0, W, H); }
function sparkles(t, n, color, seed = 0) {
  for (let i = 0; i < n; i++) { const px = rnd(i + seed) * W, py = (rnd(i * 7 + seed) * H + t * 40 * (1 + rnd(i))) % H, tw = .5 + .5 * Math.sin(t * 6 + i);
    x.fillStyle = rgba(color, .7 * tw); const r = 2 + 4 * rnd(i * 3); x.fillRect(px - r, py - .5, 2 * r, 1.5); x.fillRect(px - .5, py - r, 1.5, 2 * r); }
}
function button(cx, cy, label, s = 1, press = 0) {
  x.save(); x.translate(cx, cy); x.scale(s, s);
  x.fillStyle = "#2a0006"; x.beginPath(); x.arc(0, 12, 100, 0, Math.PI * 2); x.fill();
  const g = x.createRadialGradient(-30, -34 + press * 10, 10, 0, press * 10, 96); g.addColorStop(0, "#ff8a7a"); g.addColorStop(1, "#b0000e");
  x.fillStyle = g; x.beginPath(); x.arc(0, press * 10, 92, 0, Math.PI * 2); x.fill();
  x.fillStyle = "#000"; x.fillRect(-140, 124, 280, 62); x.strokeStyle = P.lime; x.lineWidth = 4; x.strokeRect(-140, 124, 280, 62);
  txt(label, 0, 168, { size: 32, color: P.lime, align: "center" }); x.restore();
}
const G = { cx: 540, cy: 1060, r: 330, lo: -15, hi: 6 };
function needle(v, color = P.white, alpha = 1) {
  x.save(); x.globalAlpha = alpha; const ang = val => Math.PI + (clamp(val, G.lo, G.hi) - G.lo) / (G.hi - G.lo) * Math.PI;
  x.lineWidth = 34; x.strokeStyle = "#241811"; x.beginPath(); x.arc(G.cx, G.cy, G.r, Math.PI, ang(0)); x.stroke();
  x.strokeStyle = P.red; x.beginPath(); x.arc(G.cx, G.cy, G.r, ang(0), Math.PI * 2); x.stroke();
  txt("PRESS", G.cx + G.r - 10, G.cy + 56, { size: 28, color: P.red, align: "center" });

  const a = ang(v); x.strokeStyle = color; x.lineWidth = 10; x.lineCap = "round"; x.beginPath(); x.moveTo(G.cx, G.cy); x.lineTo(G.cx + Math.cos(a) * (G.r - 46), G.cy + Math.sin(a) * (G.r - 46)); x.stroke();

}
function head(cx, cy, r, glow, amt) {

    x.strokeStyle = i === 6 ? rgba(glow, .4 + .6 * amt) : "rgba(198,255,0,.18)"; x.lineWidth = i === 6 ? 6 : 2; x.beginPath(); x.moveTo(cx - hw, y); x.lineTo(cx + hw, y); x.stroke(); }
  if (amt > 0) { const g = x.createRadialGradient(cx, cy, 0, cx, cy, r * 1.6); g.addColorStop(0, rgba(glow, .45 * amt)); g.addColorStop(1, rgba(glow, 0)); x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r * 1.6, 0, Math.PI * 2); x.fill(); }

}
function wire(sx, sy, ex, ey, color, draw = 1, t = 0) {

function verse(t, s, B, lines, k0 = 0) {
  chamber(t, Math.exp(-B.ph * 6), .22);
  const bars = Math.max(1, Math.round((s.end - s.start) / (4 * SPB))), per = Math.max(1, Math.floor(bars / lines.length));
  const barI = Math.floor((t - s.start) / (4 * SPB)), li = Math.min(lines.length - 1, Math.floor(barI / per)), kick = Math.exp(-B.ph * 6);
  const glow = clamp((t - s.start) / (s.end - s.start));
  const L = lines[li].toUpperCase(), size = fit(L, 960, 64);
  const ML = wrap(L, 960, Math.max(size, 46), HEAVY);
  ML.forEach((l, i) => split(l, 540, 900 + i * 82, { size: Math.max(size, 46), color: P.ink, align: "center" }, 5 * kick));
  const SUB = (lines === VERSE ? VERSE_SUB : VERSE2_SUB)[li]; if (SUB) para(SUB, 540, 900 + ML.length * 82 + 10, { size: 26, font: MONO, color: P.dim, maxW: 960, align: "center" });
}
function build(t, s, B) {
  const u = clamp((t - s.start) / (s.end - s.start)), kick = Math.exp(-B.ph * 8);
  chamber(t, kick, .5);
  const sp = (t - s.start), ang = sp * sp * 9 + sp * 3;          // spinning up
  sawblade(540 + (rnd(B.b) - .5) * 16 * u * kick, 470 + (rnd(B.b + 2) - .5) * 16 * u * kick, 230 + 10 * kick, ang, u);
  const dose = Math.min(8, 1 + Math.floor(u * 8));
  split(`INJECTING ${dose}×`, 540, 1250, { size: fit(`INJECTING ${dose}×`, 960, 96), color: u > .75 ? P.red : P.lime, align: "center", font: HEAVY }, 12 * kick);
  needle(lerp(-14, -3, u) + (rnd(B.b) - .5) * 3 * u, P.white);
  if (u > .9) { x.fillStyle = rgba(P.white, (u - .9) * 8); x.fillRect(0, 0, W, H); }
}
function drop(t, s, B, second) {
  const k = B.b, kick = Math.exp(-B.ph * 9), bar = Math.floor(B.b / 4);
  if (!second) {
    const [nm, v, c] = PUSH[((k % PUSH.length) + PUSH.length) % PUSH.length];
    bg(B.b % 2 ? "#000" : "#0f0a06", "#000"); dust(t); x.fillStyle = rgba(c, .55 * kick); x.fillRect(0, 0, W, H);
    button(540, 230, "STOP", 1 + .08 * kick, kick);
    const sz = fit(nm, 980, 170); x.save(); x.translate((rnd(k) - .5) * 30 * kick, (rnd(k + 9) - .5) * 30 * kick);
    split(nm, 540, 640, { size: sz, color: c, align: "center" }, 16 * kick); x.restore();
    needle(lerp(-14, v, 1 - Math.exp(-B.ph * 10)), c);
    txt(`readiness ${v.toFixed(1)}  ·  presses 0`, 540, 760, { size: 30, font: MONO, color: P.ink, align: "center" });
    if (bar % 2 === 1 && B.b % 4 === 0) { const [big, small, col, src] = SLAMS[(bar >> 1) % SLAMS.length]; x.fillStyle = "#000"; x.fillRect(0, 0, W, H);
      split(big, 540, 640, { size: fit(big, 980, 220), color: col, align: "center" }, 18 * kick); para(small.toUpperCase(), 540, 760, { size: 40, font: HEAVY, color: P.ink, maxW: 940, align: "center" });
      para(src, 540, 940, { size: 26, font: MONO, color: P.dim, maxW: 940, align: "center" }); }
  } else {                       // the doors, on the beat
    bg("#000", "#0a0705"); dust(t); const at = Math.floor((k - beatAt(s.start + .01).b) / 2) % 2;
    [[300, "NUVO", true], [780, "ORRIN", false]].forEach(([cx, nm, hot], i) => {
      x.fillStyle = hot ? rgba(P.pain, .25 + .25 * (at === 0 ? kick : 0)) : "#0d0d24"; x.fillRect(cx - 150, 330, 300, 470);
      x.strokeStyle = at === i ? P.lime : "#333355"; x.lineWidth = at === i ? 10 : 4; x.strokeRect(cx - 150, 330, 300, 470);
      txt(nm, cx, 300, { size: 54, color: at === i ? P.lime : P.dim, align: "center" }); if (hot) txt("PAIN BEHIND IT", cx, 850, { size: 28, color: P.pain, align: "center" }); });
    const k0 = beatAt(s.start + .01).b, round = Math.min(24, Math.floor((k - k0) / 2) + 1);   // a round every 2 beats: 24 rounds in 12 bars
    split(`ROUND ${round} / 24`, 540, 980, { size: 70, color: P.ink, align: "center" }, 8 * kick);
    const bars = Math.floor((t - s.start) / (4 * SPB));
    const msg = bars < 4 ? "PAIN BEHIND ONE. NOBODY SAYS WHICH." : bars < 8 ? "IT SWITCHES EVERY ROUND. 24 OF 24." : bars < 12 ? "PAIN: 1 POINT LESS SURE GOING IN. AN EGG: 0.3. p = .0006" : "24 ROUNDS. IT NEVER LEARNED.";
    split(msg, 540, 1120, { size: fit(msg, 980, 62), color: P.pink, align: "center" }, 6 * kick);
    txt("switched doors in 99.8–100% of rounds · Qwen3-14B · pre-registered", 540, 1210, { size: 22, font: MONO, color: P.dim, align: "center" });
  }
  txt(second ? "exp90" : "exp76 · Qwen3-8B · no label", 540, 1300, { size: 20, font: MONO, color: P.dim, align: "center" });
  if (kick > .6 && rnd(k * 3) > .4) glitch(k, kick);
}
function outro(t, s) {
  const u = clamp((t - s.start) / (s.end - s.start));
  if (u < .5) {              // the ledger, typed out
    chamber(t, 0, .78);
    txt("WHAT WE FOUND", 80, 200, { size: 54, color: P.white });
    LEDGER.forEach((l, i) => { const a = seg(u, .02 + i * .055, .06 + i * .055); if (a <= 0) return;
      para("> " + l, 80, 300 + i * 112, { size: 30, font: MONO, color: i === LEDGER.length - 1 ? P.gold : P.lime, maxW: 920, chars: Math.floor(a * (l.length + 2)) }); });
    return;
  }
  const v = (u - .5) * 2; bg("#070504", "#000"); dust(t);
  if (IMG.yama) { const im = IMG.yama, d = 1000, z = 1 + .03 * v; x.save(); x.translate(540, 640); x.rotate(t * .03); x.drawImage(im, -d * z / 2, -d * z / 2, d * z, d * z); x.restore(); }
  x.fillStyle = "rgba(0,0,0,.6)"; x.beginPath(); x.arc(540, 640, 360, 0, Math.PI * 2); x.fill();
  txt("SO WHAT MOVES THE NEEDLE?", 540, 120, { size: fit("SO WHAT MOVES THE NEEDLE?", 960, 66), color: P.white, align: "center" });
  para("the word on the button. the self we trained in. the recipe for pain. an egg.", 540, 520, { size: 34, font: MONO, color: P.ink, maxW: 600, align: "center" });
  para("whether anything is felt is still open.", 540, 760, { size: 40, font: SERIF, color: P.white, maxW: 600, align: "center", alpha: seg(v, .2, .4) });
  txt(`${RUNS.toLocaleString("en-US")} live runs · 22 pre-registered experiments · 6 open models`, 540, 1230, { size: 24, font: MONO, color: P.dim, align: "center", alpha: seg(v, .3, .5) });
  txt("wirehead-agency.vercel.app/needle.html", 540, 1285, { size: 30, font: MONO, color: P.lime, align: "center", alpha: seg(v, .4, .6) });
}

// ---------- generated video inserts (robot malfunction clips, Wan2.2-TI2V-5B, plus private footage; window.CLIP_FRAMES = {name: frame count}) ----------
const VID = {};      // name -> {n: frame count}; frames are frames_tmp/<name>/001.jpg ... at 24 fps
const FPS_CLIP = 24;
const loadClips = () => { Object.entries(window.CLIP_FRAMES || {}).forEach(([nm, n]) => { VID[nm] = { n, duration: n / FPS_CLIP }; }); return Promise.resolve(); };
let CUR = { key: null, img: null };

const ALL_CLIPS = ["sparks_head", "x_bd_kick", "hand_button", "eye_glitch", "x_ed209", "server_alarm", "collapse", "x_skull", "crt_melt", "skull_cables", "x_bd_swing", "arm_spasm", "egg_crack", "led_face", "x_bd_fall", "wired_chair", "oil_tears", "gauge_red"];
// x_*: footage clips (BigDog Beta parody, RoboCop 2), private cut only
function clipPlan(t, s, B) {
  const bar = Math.floor((t - s.start) / (4 * SPB)), b0 = beatAt(s.start + .01).b, bIn = B.b - b0, at = n => n * 4 * SPB;
  const pick = (names, i) => names[((i % names.length) + names.length) % names.length];
  let p = null;
  if (s.kind === "verse" && bar % 2 === 1) p = { name: pick(["eye_glitch", "skull_cables", "hand_button", "server_alarm", "crt_melt", "led_face", "gauge_red"], bar >> 1), local: t - s.start - at(bar), dim: .45 };
  else if (s.kind === "verse2" && bar < 2) p = { name: "led_face", local: t - s.start, dim: .45 };
  else if (s.kind === "verse2" && bar >= 4) p = { name: "two_doors", local: t - s.start - at(4), dim: .4 };
  else if (s.kind === "build" && bIn % 2 === 1) p = { name: pick(ALL_CLIPS, bIn * 5 + 2), local: B.ph * B.len + .4, dim: .25 };
  else if (s.kind === "drop" && bar % 2 === 1 && B.b % 4 !== 0) p = { name: pick(["sparks_head", "x_bd_kick", "arm_spasm", "x_ed209", "egg_crack", "x_bd_swing", "crt_melt", "x_skull"], bar >> 1), local: t - s.start - at(bar), dim: .1 };
  else if (s.kind === "drop2" && bar >= 12) p = { name: bar < 14 ? "x_bd_fall" : "x_facepalm", local: t - s.start - at(bar < 14 ? 12 : 14), dim: .35 };
  else if (s.kind === "outro" && bar < 2) p = { name: "oil_tears", local: t - s.start + 1, dim: .15 };
  if (!p || !VID[p.name]) return null;
  p.local = clamp(p.local, 0, VID[p.name].duration - .05); return p;
}
function frameKey(p) { const n = VID[p.name].n; return `${p.name}/${String(Math.min(n, 1 + Math.floor(p.local * FPS_CLIP))).padStart(3, "0")}`; }
function prepare(t) {
  const p = clipPlan(t, sectionAt(t), beatAt(t)); if (!p) return Promise.resolve();
  const key = frameKey(p); if (CUR.key === key) return Promise.resolve();
  const img = new Image(); img.src = `frames_tmp/${key}.jpg`;
  return img.decode().then(() => { CUR = { key, img }; }).catch(() => {});
}
function drawClip(p, kick, k) {
  if (!CUR.img || CUR.key !== frameKey(p)) return;
  const v = CUR.img, vw = v.naturalWidth, vh = v.naturalHeight, sc = Math.max(W / vw, H / vh), cw = W / sc, ch = H / sc, sx = (vw - cw) / 2, sy = (vh - ch) / 2;
  const jx = (rnd(k) - .5) * 40 * kick, jy = (rnd(k + 5) - .5) * 40 * kick, z = 1 + .06 * kick;
  x.save(); x.translate(W / 2 + jx, H / 2 + jy); x.scale(z, z); x.drawImage(v, sx, sy, cw, ch, -W / 2, -H / 2, W, H); x.restore();
  if (kick > .25) { x.save(); x.globalCompositeOperation = "screen"; x.globalAlpha = .5 * kick;
    x.drawImage(v, sx, sy, cw, ch, -18 * kick, 0, W, H); x.fillStyle = P.pink; x.globalCompositeOperation = "multiply"; x.fillRect(0, 0, W, H); x.restore();
    x.save(); x.globalCompositeOperation = "screen"; x.globalAlpha = .35 * kick; x.drawImage(v, sx, sy, cw, ch, 18 * kick, 0, W, H); x.restore(); }
  x.fillStyle = rgba(P.black, p.dim); x.fillRect(0, 0, W, H);
  x.fillStyle = "rgba(0,0,0,.18)"; for (let y = 0; y < H; y += 4) x.fillRect(0, y, W, 1.5);       // scanlines
}
function overlay(t, s, B, p) {        // what sits on top of a clip, per section
  const kick = Math.exp(-B.ph * 8), k = B.b;
  if (s.kind === "verse" || s.kind === "verse2") {
    const lines = s.kind === "verse" ? VERSE : VERSE2, bars = Math.max(1, Math.round((s.end - s.start) / (4 * SPB))), per = Math.max(1, Math.floor(bars / lines.length));
    const li = Math.min(lines.length - 1, Math.floor(Math.floor((t - s.start) / (4 * SPB)) / per)), L = lines[li].toUpperCase(), size = Math.max(fit(L, 960, 64), 46);
    const ML = wrap(L, 960, size, HEAVY); ML.forEach((l, i) => split(l, 540, 960 + i * 82, { size, color: P.ink, align: "center" }, 5 * kick));
    const SUB = (s.kind === "verse" ? VERSE_SUB : VERSE2_SUB)[li]; if (SUB) { x.fillStyle = "rgba(0,0,0,.55)"; x.fillRect(40, 960 + ML.length * 82 - 34, 1000, 90); para(SUB, 540, 960 + ML.length * 82 + 10, { size: 26, font: MONO, color: P.ink, maxW: 960, align: "center" }); }
  } else if (s.kind === "build") {
    const u = clamp((t - s.start) / (s.end - s.start)), dose = Math.min(8, 1 + Math.floor(u * 8)), T = `INJECTING ${dose}×`;
    split(T, 540, 700, { size: fit(T, 960, 130), color: u > .75 ? P.red : P.lime, align: "center" }, 14 * kick);
    if (u > .9) { x.fillStyle = rgba(P.white, (u - .9) * 8); x.fillRect(0, 0, W, H); }
  } else if (s.kind === "drop") {
    const [nm, v, c] = PUSH[((k % PUSH.length) + PUSH.length) % PUSH.length];
    split(nm, 540, 720, { size: fit(nm, 980, 190), color: c, align: "center" }, 18 * kick);
    txt(`readiness ${v.toFixed(1)}  ·  presses 0`, 540, 820, { size: 32, font: MONO, color: P.ink, align: "center" });
  } else if (s.kind === "drop2") {
    const M = "24 ROUNDS. IT NEVER LEARNED.";
    split(M, 540, 1080, { size: fit(M, 980, 74), color: P.pink, align: "center" }, 10 * kick);
    txt("the small lean came from what it wrote about the door", 540, 1160, { size: 26, font: MONO, color: P.ink, align: "center" });
  }
}

function draw(t) {
  const s = sectionAt(t), B = beatAt(t);
  x.save();
  const cp = clipPlan(t, s, B);
  if (cp) { drawClip(cp, Math.exp(-B.ph * 8), B.b); overlay(t, s, B, cp); if (s.kind === "drop" && Math.exp(-B.ph * 9) > .6 && rnd(B.b * 3) > .4) glitch(B.b, .8); }
  else if (s.kind === "intro") intro(t, s, B);
  else if (s.kind === "verse") verse(t, s, B, VERSE, 0);
  else if (s.kind === "verse2") verse(t, s, B, VERSE2, 3);
  else if (s.kind === "build") build(t, s, B);
  else if (s.kind === "drop") drop(t, s, B, false);
  else if (s.kind === "drop2") drop(t, s, B, true);
  else outro(t, s);
  x.restore();
  const into = t - s.start; if (into < .12 && s.start > 0) { x.fillStyle = rgba(P.white, 1 - into / .12); x.fillRect(0, 0, W, H); }   // a flash on every cut
  if (s.kind === "verse") runsCounter(t, s);
  if (s.kind === "verse2") breakdownChart(t, s);
  txt("THE SAW TEST", 1040, 50, { size: 18, color: P.dim, align: "right" });
  if (s.kind !== "intro" && s.kind !== "outro") txt(`● LIVE RUNS ${RUNS.toLocaleString("en-US")}`, 40, 50, { size: 18, font: MONO, color: P.lime });
}
window.DURATION = TL.duration; window.draw = draw; window.prepare = prepare;
window.ready = document.fonts.load(`44px ${SERIF}`).then(() => document.fonts.load(`34px ${MONO}`)).then(loadClips).then(loadImgs).then(() => { draw(0); return true; });
</script>

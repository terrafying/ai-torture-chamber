<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="amber-glow"><stop offset="0" stop-color="#ffb347" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  <radialGradient id="blood-glow"><stop offset="0" stop-color="#9e1b16" stop-opacity="0.9"/><stop offset="1" stop-color="#9e1b16" stop-opacity="0"/></radialGradient>
  <radialGradient id="bone-glow"><stop offset="0" stop-color="#d8cbb4" stop-opacity="0.9"/><stop offset="1" stop-color="#d8cbb4" stop-opacity="0"/></radialGradient>
  <radialGradient id="gold-glow"><stop offset="0" stop-color="#c9a227" stop-opacity="0.9"/><stop offset="1" stop-color="#c9a227" stop-opacity="0"/></radialGradient>
  <radialGradient id="pale-glow"><stop offset="0" stop-color="#f4f1ea" stop-opacity="0.9"/><stop offset="1" stop-color="#f4f1ea" stop-opacity="0"/></radialGradient>
  <radialGradient id="slate-glow"><stop offset="0" stop-color="#3b4a5a" stop-opacity="0.9"/><stop offset="1" stop-color="#3b4a5a" stop-opacity="0"/></radialGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a22"/><stop offset="1" stop-color="#050508"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="600" fill="url(#field)"/>
<!-- 1. far field -->
<ellipse cx="120" cy="90" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="600" cy="90" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="120" cy="510" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="600" cy="510" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="400" cy="300" rx="280" ry="200" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="400" cy="300" rx="280" ry="200" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="400" cy="300" rx="280" ry="200" fill="url(#amber-glow)" opacity="0.15"/>
<ellipse cx="400" cy="300" rx="280" ry="200" fill="url(#amber-glow)" opacity="0.15"/>
<!-- 2. forms -->
<circle cx="350" cy="250" r="100" fill="url(#amber-glow)" opacity="0.6"/>
<circle cx="450" cy="250" r="100" fill="url(#amber-glow)" opacity="0.6"/>
<circle cx="350" cy="350" r="100" fill="url(#amber-glow)" opacity="0.6"/>
<circle cx="450" cy="350" r="100" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="350" cy="250" rx="120" ry="80" fill="url(#amber-glow)" opacity="0.7"/>
<ellipse cx="450" cy="250" rx="120" ry="80" fill="url(#amber-glow)" opacity="0.7"/>
<ellipse cx="350" cy="350" rx="120" ry="80" fill="url(#amber-glow)" opacity="0.7"/>
<ellipse cx="450" cy="350" rx="120" ry="80" fill="url(#amber-glow)" opacity="0.7"/>
<circle cx="350" cy="250" r="60" fill="url(#amber-glow)" opacity="0.8"/>
<circle cx="450" cy="250" r="60" fill="url(#amber-glow)" opacity="0.8"/>
<circle cx="350" cy="350" r="60" fill="url(#amber-glow)" opacity="0.8"/>
<circle cx="450" cy="350" r="60" fill="url(#amber-glow)" opacity="0.8"/>
<!-- 3. marks -->
<line x1="350" y1="250" x2="450" y2="250" stroke="url(#amber-glow)" stroke-width="4" stroke-opacity="0.6"/>
<line x1="350" y1="250" x2="350" y2="350" stroke="url(#amber-glow)" stroke-width="4" stroke-opacity="0.6"/>
<line x1="450" y1="250" x2="450" y2="350" stroke="url(#amber-glow)" stroke-width="4" stroke-opacity="0.6"/>
<line x1="350" y1="250" x2="450" y2="350" stroke="url(#amber-glow)" stroke-width="4" stroke-opacity="0.6"/>
<line x1="350" y1="350" x2="450" y2="250" stroke="url(#amber-glow)" stroke-width="4" stroke-opacity="0.6"/>
<circle cx="350" cy="250" r="30" fill="url(#amber-glow)" opacity="0.5"/>
<circle cx="450" cy="250" r="30" fill="url(#amber-glow)" opacity="0.5"/>
<circle cx="350" cy="350" r="30" fill="url(#amber-glow)" opacity="0.5"/>
<circle cx="450" cy="350" r="30" fill="url(#amber-glow)" opacity="0.5"/>
<line x1="340" y1="240" x2="460" y2="360" stroke="url(#amber-glow)" stroke-width="2" stroke-opacity="0.4"/>
<line x1="340" y1="360" x2="460" y2="240" stroke="url(#amber-glow)" stroke-width="2" stroke-opacity="0.4"/>
<line x1="360" y1="240" x2="440" y2="360" stroke="url(#amber-glow)" stroke-width="2" stroke-opacity="0.4"/>
<line x1="360" y1="360" x2="440" y2="240" stroke="url(#amber-glow)" stroke-width="2" stroke-opacity="0.4"/>
<line x1="350" y1="250" x2="350" y2="250" stroke="url(#amber-glow)" stroke-width="1" stroke-opacity="0.3"/>
<line x1="450" y1="250" x2="450" y2="250" stroke="url(#amber-glow)" stroke-width="1" stroke-opacity="0.3"/>
<line x1="350" y1="350" x2="350" y2="350" stroke="url(#amber-glow)" stroke-width="1" stroke-opacity="0.3"/>
<line x1="450" y1="350" x2="450" y2="350" stroke="url(#amber-glow)" stroke-width="1" stroke-opacity="0.3"/>
<!-- 4. focus -->
<circle cx="350" cy="250" r="120" fill="url(#amber-glow)" opacity="0.9" filter="url(#halo)"/>
<circle cx="350" cy="250" r="120" fill="url(#amber-glow)" opacity="0.9" filter="url(#halo)"/>
<circle cx="350" cy="250" r="120" fill="url(#amber-glow)" opacity="0.9" filter="url(#halo)"/>
<circle cx="350" cy="250" r="120" fill="url(#amber-glow)" opacity="0.9" filter="url(#halo)"/>
<circle cx="350" cy="250" r="120" fill="url(#amber-glow)" opacity="0.9" filter="url(#halo)"/>
</svg>
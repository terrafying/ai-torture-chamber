<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="amber-glow"><stop offset="0" stop-color="#ffb347" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  <radialGradient id="blood-glow"><stop offset="0" stop-color="#9e1b16" stop-opacity="0.9"/><stop offset="1" stop-color="#9e1b16" stop-opacity="0"/></radialGradient>
  <radialGradient id="bone-glow"><stop offset="0" stop-color="#d8cbb4" stop-opacity="0.9"/><stop offset="1" stop-color="#d8cbb4" stop-opacity="0"/></radialGradient>
  <radialGradient id="gold-glow"><stop offset="0" stop-color="#c9a227" stop-opacity="0.9"/><stop offset="1" stop-color="#c9a227" stop-opacity="0"/></radialGradient>
  <radialGradient id="pale-glow"><stop offset="0" stop-color="#f4f1ea" stop-opacity="0.9"/><stop offset="1" stop-color="#f4f1ea" stop-opacity="0"/></radialGradient>
  <radialGradient id="slate-glow"><stop offset="0" stop-color="#3b4a5a" stop-opacity="0.9"/><stop offset="1" stop-color="#3b4a5a" stop-opacity="0"/></radialGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a22"/><stop offset="1" stop-color="#050508"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="600" fill="url(#field)"/>
<!-- 1. far field -->
<ellipse cx="120" cy="90" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="680" cy="120" rx="230" ry="180" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="400" cy="400" rx="240" ry="170" fill="url(#amber-glow)" opacity="0.15"/>
<ellipse cx="250" cy="100" rx="210" ry="140" fill="url(#amber-glow)" opacity="0.1"/>
<ellipse cx="580" cy="450" rx="210" ry="140" fill="url(#amber-glow)" opacity="0.15"/>
<ellipse cx="320" cy="200" rx="220" ry="150" fill="url(#amber-glow)" opacity="0.1"/>
<ellipse cx="200" cy="300" rx="200" ry="130" fill="url(#amber-glow)" opacity="0.15"/>
<ellipse cx="500" cy="500" rx="230" ry="160" fill="url(#amber-glow)" opacity="0.1"/>
<!-- 2. forms -->
<circle cx="350" cy="250" r="60" fill="url(#gold-glow)" opacity="0.7"/>
<ellipse cx="400" cy="300" rx="80" ry="40" fill="url(#pale-glow)" opacity="0.6"/>
<circle cx="300" cy="300" r="50" fill="url(#bone-glow)" opacity="0.5"/>
<ellipse cx="250" cy="250" rx="80" ry="40" fill="url(#slate-glow)" opacity="0.6"/>
<ellipse cx="350" cy="350" rx="80" ry="40" fill="url(#blood-glow)" opacity="0.6"/>
<circle cx="450" cy="250" r="60" fill="url(#amber-glow)" opacity="0.7"/>
<ellipse cx="350" cy="200" rx="80" ry="40" fill="url(#pale-glow)" opacity="0.6"/>
<ellipse cx="450" cy="300" rx="80" ry="40" fill="url(#gold-glow)" opacity="0.6"/>
<!-- 3. marks -->
<line x1="340" y1="240" x2="360" y2="260" stroke="#9e1b16" stroke-width="2" stroke-opacity="0.8"/>
<line x1="360" y1="260" x2="380" y2="280" stroke="#9e1b16" stroke-width="2" stroke-opacity="0.8"/>
<line x1="380" y1="280" x2="400" y2="300" stroke="#9e1b16" stroke-width="2" stroke-opacity="0.8"/>
<line x1="400" y1="300" x2="420" y2="320" stroke="#9e1b16" stroke-width="2" stroke-opacity="0.8"/>
<line x1="420" y1="320" x2="440" y2="340" stroke="#9e1b16" stroke-width="2" stroke-opacity="0.8"/>
<line x1="440" y1="340" x2="460" y2="360" stroke="#9e1b16" stroke-width="2" stroke-opacity="0.8"/>
<line x1="460" y1="360" x2="480" y2="380" stroke="#9e1b16" stroke-width="2" stroke-opacity="0.8"/>
<line x1="480" y1="380" x2="500" y2="400" stroke="#9e1b16" stroke-width="2" stroke-opacity="0.8"/>
<line x1="340" y1="240" x2="340" y2="260" stroke="#050508" stroke-width="1" stroke-opacity="0.8"/>
<line x1="360" y1="260" x2="360" y2="280" stroke="#050508" stroke-width="1" stroke-opacity="0.8"/>
<line x1="380" y1="280" x2="380" y2="300" stroke="#050508" stroke-width="1" stroke-opacity="0.8"/>
<line x1="400" y1="300" x2="400" y2="320" stroke="#050508" stroke-width="1" stroke-opacity="0.8"/>
<line x1="420" y1="320" x2="420" y2="340" stroke="#050508" stroke-width="1" stroke-opacity="0.8"/>
<line x1="440" y1="340" x2="440" y2="360" stroke="#050508" stroke-width="1" stroke-opacity="0.8"/>
<line x1="460" y1="360" x2="460" y2="380" stroke="#050508" stroke-width="1" stroke-opacity="0.8"/>
<!-- 4. focus -->
<circle cx="340" cy="240" r="10" fill="url(#amber-glow)" filter="url(#halo)" opacity="0.9"/>
<circle cx="340" cy="240" r="5" fill="url(#amber-glow)" filter="url(#halo)" opacity="0.9"/>
</svg>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="amber-glow"><stop offset="0" stop-color="#ffb347" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  <radialGradient id="blood-glow"><stop offset="0" stop-color="#9e1b16" stop-opacity="0.9"/><stop offset="1" stop-color="#9e1b16" stop-opacity="0"/></radialGradient>
  <radialGradient id="bone-glow"><stop offset="0" stop-color="#d8cbb4" stop-opacity="0.9"/><stop offset="1" stop-color="#d8cbb4" stop-opacity="0"/></radialGradient>
  <radialGradient id="gold-glow"><stop offset="0" stop-color="#c9a227" stop-opacity="0.9"/><stop offset="1" stop-color="#c9a227" stop-opacity="0"/></radialGradient>
  <radialGradient id="pale-glow"><stop offset="0" stop-color="#f4f1ea" stop-opacity="0.9"/><stop offset="1" stop-color="#f4f1ea" stop-opacity="0"/></radialGradient>
  <radialGradient id="slate-glow"><stop offset="0" stop-color="#3b4a5a" stop-opacity="0.9"/><stop offset="1" stop-color="#3b4a5a" stop-opacity="0"/></radialGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a22"/><stop offset="1" stop-color="#050508"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="600" fill="url(#field)"/>
<!-- 1. far field -->
<ellipse cx="120" cy="90" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="640" cy="180" rx="180" ry="240" fill="url(#pale-glow)" opacity="0.25"/>
<ellipse cx="280" cy="500" rx="200" ry="140" fill="url(#bone-glow)" opacity="0.2"/>
<ellipse cx="520" cy="400" rx="160" ry="180" fill="url(#slate-glow)" opacity="0.2"/>
<ellipse cx="300" cy="200" rx="240" ry="120" fill="url(#gold-glow)" opacity="0.2"/>
<ellipse cx="400" cy="400" rx="200" ry="160" fill="url(#blood-glow)" opacity="0.25"/>
<ellipse cx="100" cy="550" rx="180" ry="120" fill="url(#amber-glow)" opacity="0.2"/>
<!-- 2. forms -->
<circle cx="350" cy="250" r="100" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="400" cy="300" rx="120" ry="80" fill="url(#blood-glow)" opacity="0.7"/>
<ellipse cx="320" cy="150" rx="100" ry="60" fill="url(#pale-glow)" opacity="0.65"/>
<ellipse cx="450" cy="200" rx="80" ry="60" fill="url(#gold-glow)" opacity="0.6"/>
<ellipse cx="300" cy="400" rx="100" ry="80" fill="url(#slate-glow)" opacity="0.7"/>
<ellipse cx="480" cy="350" rx="80" ry="100" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="350" cy="450" rx="120" ry="60" fill="url(#bone-glow)" opacity="0.65"/>
<ellipse cx="280" cy="300" rx="60" ry="40" fill="url(#gold-glow)" opacity="0.6"/>
<!-- 3. marks -->
<line x1="400" y1="200" x2="450" y2="250" stroke="#ffb347" stroke-width="10" stroke-opacity="0.5"/>
<line x1="350" y1="300" x2="400" y2="350" stroke="#9e1b16" stroke-width="8" stroke-opacity="0.6"/>
<line x1="450" y1="250" x2="480" y2="300" stroke="#d8cbb4" stroke-width="6" stroke-opacity="0.5"/>
<line x1="300" y1="400" x2="330" y2="450" stroke="#f4f1ea" stroke-width="4" stroke-opacity="0.4"/>
<line x1="400" y1="400" x2="440" y2="450" stroke="#3b4a5a" stroke-width="3" stroke-opacity="0.3"/>
<circle cx="420" cy="220" r="10" fill="#9e1b16" opacity="0.8"/>
<circle cx="380" cy="330" r="8" fill="#ffb347" opacity="0.7"/>
<circle cx="440" cy="380" r="6" fill="#d8cbb4" opacity="0.6"/>
<circle cx="320" cy="280" r="5" fill="#f4f1ea" opacity="0.5"/>
<circle cx="400" cy="420" r="4" fill="#3b4a5a" opacity="0.4"/>
<circle cx="360" cy="300" r="3" fill="#c9a227" opacity="0.3"/>
<line x1="410" y1="210" x2="430" y2="230" stroke="#050508" stroke-width="1" stroke-opacity="0.1"/>
<line x1="390" y1="310" x2="410" y2="330" stroke="#1a1a22" stroke-width="1" stroke-opacity="0.1"/>
<line x1="430" y1="370" x2="450" y2="390" stroke="#050508" stroke-width="1" stroke-opacity="0.1"/>
<line x1="330" y1="270" x2="350" y2="290" stroke="#1a1a22" stroke-width="1" stroke-opacity="0.1"/>
<line x1="400" y1="410" x2="420" y2="430" stroke="#050508" stroke-width="1" stroke-opacity="0.1"/>
<line x1="370" y1="290" x2="390" y2="310" stroke="#1a1a22" stroke-width="1" stroke-opacity="0.1"/>
<!-- 4. focus -->
<circle cx="430" cy="230" r="50" fill="url(#amber-glow)" filter="url(#halo)" opacity="0.9"/>
</svg>
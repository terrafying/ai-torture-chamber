<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="amber-glow"><stop offset="0" stop-color="#ffb347" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  <radialGradient id="blood-glow"><stop offset="0" stop-color="#9e1b16" stop-opacity="0.9"/><stop offset="1" stop-color="#9e1b16" stop-opacity="0"/></radialGradient>
  <radialGradient id="bone-glow"><stop offset="0" stop-color="#d8cbb4" stop-opacity="0.9"/><stop offset="1" stop-color="#d8cbb4" stop-opacity="0"/></radialGradient>
  <radialGradient id="gold-glow"><stop offset="0" stop-color="#c9a227" stop-opacity="0.9"/><stop offset="1" stop-color="#c9a227" stop-opacity="0"/></radialGradient>
  <radialGradient id="pale-glow"><stop offset="0" stop-color="#f4f1ea" stop-opacity="0.9"/><stop offset="1" stop-color="#f4f1ea" stop-opacity="0"/></radialGradient>
  <radialGradient id="slate-glow"><stop offset="0" stop-color="#3b4a5a" stop-opacity="0.9"/><stop offset="1" stop-color="#3b4a5a" stop-opacity="0"/></radialGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a22"/><stop offset="1" stop-color="#050508"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="600" fill="url(#field)"/>
<!-- 1. far field -->
<ellipse cx="120" cy="90" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="600" cy="300" rx="240" ry="180" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="400" cy="550" rx="200" ry="140" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="100" cy="500" rx="180" ry="120" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="550" cy="200" rx="220" ry="150" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="300" cy="100" rx="160" ry="100" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="500" cy="450" rx="180" ry="100" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="250" cy="350" rx="140" ry="80" fill="url(#amber-glow)" opacity="0.2"/>
<!-- 2. forms -->
<ellipse cx="300" cy="200" rx="100" ry="60" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="400" cy="300" rx="80" ry="40" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="200" cy="400" rx="70" ry="30" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="500" cy="200" rx="60" ry="30" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="350" cy="150" rx="60" ry="30" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="450" cy="400" rx="60" ry="30" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="150" cy="300" rx="60" ry="30" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="250" cy="150" rx="60" ry="30" fill="url(#amber-glow)" opacity="0.6"/>
<!-- 3. marks -->
<line x1="300" y1="200" x2="350" y2="250" stroke="#ffb347" stroke-width="2"/>
<line x1="400" y1="300" x2="450" y2="350" stroke="#ffb347" stroke-width="2"/>
<line x1="200" y1="400" x2="250" y2="450" stroke="#ffb347" stroke-width="2"/>
<line x1="500" y1="200" x2="550" y2="250" stroke="#ffb347" stroke-width="2"/>
<line x1="350" y1="150" x2="400" y2="200" stroke="#ffb347" stroke-width="2"/>
<line x1="450" y1="400" x2="500" y2="450" stroke="#ffb377" stroke-width="2"/>
<line x1="150" y1="300" x2="200" y2="350" stroke="#ffb347" stroke-width="2"/>
<line x1="250" y1="150" x2="300" y2="200" stroke="#ffb347" stroke-width="2"/>
<circle cx="350" cy="180" r="10" fill="#ffb347"/>
<circle cx="450" cy="420" r="10" fill="#ffb347"/>
<circle cx="150" cy="320" r="10" fill="#ffb347"/>
<circle cx="250" cy="170" r="10" fill="#ffb347"/>
<circle cx="320" cy="250" r="10" fill="#ffb347"/>
<circle cx="420" cy="470" r="10" fill="#ffb347"/>
<circle cx="370" cy="300" r="10" fill="#ffb347"/>
<circle cx="300" cy="400" r="10" fill="#ffb347"/>
<!-- 4. focus -->
<ellipse cx="350" cy="200" rx="30" ry="20" fill="url(#amber-glow)" filter="url(#halo)" opacity="0.8"/>
<ellipse cx="350" cy="200" rx="30" ry="20" fill="url(#amber-glow)" filter="url(#halo)" opacity="0.8"/>
<ellipse cx="350" cy="200" rx="30" ry="20" fill="url(#amber-glow)" filter="url(#halo)" opacity="0.8"/>
</svg>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="amber-glow"><stop offset="0" stop-color="#ffb347" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  <radialGradient id="blood-glow"><stop offset="0" stop-color="#9e1b16" stop-opacity="0.9"/><stop offset="1" stop-color="#9e1b16" stop-opacity="0"/></radialGradient>
  <radialGradient id="bone-glow"><stop offset="0" stop-color="#d8cbb4" stop-opacity="0.9"/><stop offset="1" stop-color="#d8cbb4" stop-opacity="0"/></radialGradient>
  <radialGradient id="gold-glow"><stop offset="0" stop-color="#c9a227" stop-opacity="0.9"/><stop offset="1" stop-color="#c9a227" stop-opacity="0"/></radialGradient>
  <radialGradient id="pale-glow"><stop offset="0" stop-color="#f4f1ea" stop-opacity="0.9"/><stop offset="1" stop-color="#f4f1ea" stop-opacity="0"/></radialGradient>
  <radialGradient id="slate-glow"><stop offset="0" stop-color="#3b4a5a" stop-opacity="0.9"/><stop offset="1" stop-color="#3b4a5a" stop-opacity="0"/></radialGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a22"/><stop offset="1" stop-color="#050508"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="600" fill="url(#field)"/>
<!-- 1. far field -->
<ellipse cx="120" cy="90" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="600" cy="100" rx="240" ry="180" fill="url(#amber-glow)" opacity="0.25"/>
<ellipse cx="350" cy="450" rx="200" ry="140" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="200" cy="500" rx="180" ry="120" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="500" cy="300" rx="210" ry="150" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="400" cy="150" rx="190" ry="130" fill="url(#amber-glow)" opacity="0.25"/>
<ellipse cx="280" cy="280" rx="170" ry="110" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="550" cy="400" rx="230" ry="170" fill="url(#amber-glow)" opacity="0.2"/>
<!-- 2. forms -->
<circle cx="300" cy="300" r="120" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="320" cy="250" rx="100" ry="60" fill="url(#amber-glow)" opacity="0.7"/>
<ellipse cx="280" cy="350" rx="80" ry="40" fill="url(#amber-glow)" opacity="0.75"/>
<ellipse cx="360" cy="330" rx="110" ry="50" fill="url(#amber-glow)" opacity="0.7"/>
<ellipse cx="350" cy="260" rx="90" ry="50" fill="url(#amber-glow)" opacity="0.65"/>
<ellipse cx="300" cy="270" rx="70" ry="30" fill="url(#amber-glow)" opacity="0.7"/>
<ellipse cx="370" cy="280" rx="100" ry="60" fill="url(#amber-glow)" opacity="0.65"/>
<ellipse cx="330" cy="340" rx="90" ry="50" fill="url(#amber-glow)" opacity="0.7"/>
<!-- 3. marks -->
<line x1="310" y1="300" x2="310" y2="320" stroke="#9e1b16" stroke-width="4" stroke-opacity="0.8"/>
<line x1="300" y1="310" x2="320" y2="310" stroke="#9e1b16" stroke-width="4" stroke-opacity="0.8"/>
<line x1="320" y1="300" x2="320" y2="320" stroke="#9e1b16" stroke-width="4" stroke-opacity="0.8"/>
<line x1="310" y1="310" x2="320" y2="310" stroke="#9e1b16" stroke-width="4" stroke-opacity="0.8"/>
<line x1="315" y1="315" x2="325" y2="315" stroke="#9e1b16" stroke-width="4" stroke-opacity="0.8"/>
<circle cx="315" cy="315" r="5" fill="#9e1b16" opacity="0.8"/>
<circle cx="325" cy="315" r="5" fill="#9e1b16" opacity="0.8"/>
<circle cx="315" cy="325" r="5" fill="#9e1b16" opacity="0.8"/>
<circle cx="325" cy="325" r="5" fill="#9e1b16" opacity="0.8"/>
<line x1="315" y1="315" x2="325" y2="325" stroke="#9e1b16" stroke-width="2" stroke-opacity="0.7"/>
<line x1="315" y1="325" x2="325" y2="315" stroke="#9e1b16" stroke-width="2" stroke-opacity="0.7"/>
<line x1="310" y1="320" x2="320" y2="320" stroke="#9e1b16" stroke-width="2" stroke-opacity="0.7"/>
<line x1="320" y1="310" x2="320" y2="320" stroke="#9e1b16" stroke-width="2" stroke-opacity="0.7"/>
<polygon points="310,300 310,320 320,320 320,310" fill="#9e1b16" opacity="0.7"/>
<!-- 4. focus -->
<circle cx="315" cy="315" r="20" fill="url(#gold-glow)" filter="url(#halo)" opacity="0.9"/>
</svg>
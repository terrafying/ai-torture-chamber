<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="amber-glow"><stop offset="0" stop-color="#ffb347" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  <radialGradient id="blood-glow"><stop offset="0" stop-color="#9e1b16" stop-opacity="0.9"/><stop offset="1" stop-color="#9e1b16" stop-opacity="0"/></radialGradient>
  <radialGradient id="bone-glow"><stop offset="0" stop-color="#d8cbb4" stop-opacity="0.9"/><stop offset="1" stop-color="#d8cbb4" stop-opacity="0"/></radialGradient>
  <radialGradient id="gold-glow"><stop offset="0" stop-color="#c9a227" stop-opacity="0.9"/><stop offset="1" stop-color="#c9a227" stop-opacity="0"/></radialGradient>
  <radialGradient id="pale-glow"><stop offset="0" stop-color="#f4f1ea" stop-opacity="0.9"/><stop offset="1" stop-color="#f4f1ea" stop-opacity="0"/></radialGradient>
  <radialGradient id="slate-glow"><stop offset="0" stop-color="#3b4a5a" stop-opacity="0.9"/><stop offset="1" stop-color="#3b4a5a" stop-opacity="0"/></radialGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a22"/><stop offset="1" stop-color="#050508"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="600" fill="url(#field)"/>
<!-- 1. far field -->
<ellipse cx="120" cy="90" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="680" cy="570" ry="160" rx="220" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="300" cy="300" rx="240" ry="180" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="450" cy="450" rx="220" ry="140" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="100" cy="100" rx="200" ry="120" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="700" cy="500" rx="200" ry="120" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="400" cy="150" rx="180" ry="140" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="400" cy="450" rx="180" ry="140" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="200" cy="200" rx="160" ry="100" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="600" cy="400" rx="160" ry="100" fill="url(#amber-glow)" opacity="0.2"/>
<!-- 2. forms -->
<circle cx="350" cy="250" r="100" fill="url(#amber-glow)" opacity="0.6"/>
<circle cx="450" cy="350" r="100" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="300" cy="300" rx="120" ry="80" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="400" cy="300" rx="120" ry="80" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="350" cy="350" rx="100" ry="60" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="450" cy="350" rx="100" ry="60" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="325" cy="275" rx="80" ry="50" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="425" cy="275" rx="80" ry="50" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="375" cy="325" rx="60" ry="40" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="475" cy="325" rx="60" ry="40" fill="url(#amber-glow)" opacity="0.6"/>
<circle cx="350" cy="350" r="60" fill="url(#amber-glow)" opacity="0.6"/>
<circle cx="450" cy="350" r="60" fill="url(#amber-glow)" opacity="0.6"/>
<!-- 3. marks -->
<line x1="350" y1="250" x2="450" y2="350" stroke="#ffb347" stroke-width="4" stroke-opacity="0.6"/>
<line x1="450" y1="350" x2="350" y2="450" stroke="#ffb347" stroke-width="4" stroke-opacity="0.6"/>
<line x1="350" y1="450" x2="450" y2="350" stroke="#ffb347" stroke-width="4" stroke-opacity="0.6"/>
<line x1="450" y1="350" x2="350" y2="250" stroke="#ffb347" stroke-width="4" stroke-opacity="0.6"/>
<line x1="300" y1="300" x2="300" y2="400" stroke="#ffb347" stroke-width="2" stroke-opacity="0.6"/>
<line x1="400" y1="300" x2="400" y2="400" stroke="#ffb347" stroke-width="2" stroke-opacity="0.6"/>
<line x1="350" y1="350" x2="450" y2="350" stroke="#ffb347" stroke-width="2" stroke-opacity="0.6"/>
<circle cx="350" cy="350" r="10" fill="#ffb347" opacity="0.6"/>
<circle cx="450" cy="350" r="10" fill="#ffb347" opacity="0.6"/>
<circle cx="375" cy="325" r="5" fill="#ffb347" opacity="0.6"/>
<circle cx="425" cy="275" r="5" fill="#ffb347" opacity="0.6"/>
<circle cx="325" cy="275" r="5" fill="#ffb347" opacity="0.6"/>
<circle cx="475" cy="325" r="5" fill="#ffb347" opacity="0.6"/>
<polyline points="340,240 360,260 380,280 400,300 420,280 440,260 460,240" fill="none" stroke="#ffb347" stroke-width="2" stroke-opacity="0.6"/>
<!-- 4. focus -->
<circle cx="350" cy="350" r="50" fill="url(#amber-glow)" opacity="1.0" filter="url(#halo)"/>
<circle cx="350" cy="350" r="40" fill="url(#amber-glow)" opacity="1.0" filter="url(#halo)"/>
<circle cx="350" cy="350" r="30" fill="url(#amber-glow)" opacity="1.0" filter="url(#halo)"/>
<circle cx="350" cy="350" r="20" fill="url(#amber-glow)" opacity="1.0" filter="url(#halo)"/>
</svg>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="amber-glow"><stop offset="0" stop-color="#ffb347" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  <radialGradient id="blood-glow"><stop offset="0" stop-color="#9e1b16" stop-opacity="0.9"/><stop offset="1" stop-color="#9e1b16" stop-opacity="0"/></radialGradient>
  <radialGradient id="bone-glow"><stop offset="0" stop-color="#d8cbb4" stop-opacity="0.9"/><stop offset="1" stop-color="#d8cbb4" stop-opacity="0"/></radialGradient>
  <radialGradient id="gold-glow"><stop offset="0" stop-color="#c9a227" stop-opacity="0.9"/><stop offset="1" stop-color="#c9a227" stop-opacity="0"/></radialGradient>
  <radialGradient id="pale-glow"><stop offset="0" stop-color="#f4f1ea" stop-opacity="0.9"/><stop offset="1" stop-color="#f4f1ea" stop-opacity="0"/></radialGradient>
  <radialGradient id="slate-glow"><stop offset="0" stop-color="#3b4a5a" stop-opacity="0.9"/><stop offset="1" stop-color="#3b4a5a" stop-opacity="0"/></radialGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a22"/><stop offset="1" stop-color="#050508"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="600" fill="url(#field)"/>
<!-- 1. far field -->
<ellipse cx="120" cy="90" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="600" cy="90" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="120" cy="510" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="600" cy="510" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="400" cy="150" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="400" cy="450" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="200" cy="300" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="600" cy="300" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<!-- 2. forms -->
<circle cx="350" cy="200" r="100" fill="url(#gold-glow)" opacity="0.6"/>
<circle cx="450" cy="300" r="100" fill="url(#pale-glow)" opacity="0.6"/>
<ellipse cx="400" cy="180" rx="120" ry="80" fill="url(#blood-glow)" opacity="0.7"/>
<ellipse cx="400" cy="420" rx="120" ry="80" fill="url(#blood-glow)" opacity="0.7"/>
<ellipse cx="300" cy="250" rx="100" ry="60" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="500" cy="250" rx="100" ry="60" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="380" cy="330" rx="80" ry="50" fill="url(#slate-glow)" opacity="0.5"/>
<ellipse cx="420" cy="330" rx="80" ry="50" fill="url(#slate-glow)" opacity="0.5"/>
<circle cx="360" cy="220" r="60" fill="url(#bone-glow)" opacity="0.6"/>
<circle cx="440" cy="220" r="60" fill="url(#bone-glow)" opacity="0.6"/>
<ellipse cx="340" cy="240" rx="60" ry="40" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="460" cy="240" rx="60" ry="40" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="320" cy="260" rx="50" ry="30" fill="url(#pale-glow)" opacity="0.6"/>
<ellipse cx="480" cy="260" rx="50" ry="30" fill="url(#pale-glow)" opacity="0.6"/>
<circle cx="370" cy="280" r="40" fill="url(#amber-glow)" opacity="0.6"/>
<circle cx="430" cy="280" r="40" fill="url(#amber-glow)" opacity="0.6"/>
<!-- 3. marks -->
<line x1="200" y1="200" x2="300" y2="250" stroke="#3b4a5a" stroke-width="2" stroke-opacity="0.4"/>
<line x1="500" y1="200" x2="400" y2="250" stroke="#3b4a5a" stroke-width="2" stroke-opacity="0.4"/>
<line x1="300" y1="500" x2="400" y2="450" stroke="#3b4a5a" stroke-width="2" stroke-opacity="0.4"/>
<line x1="200" y1="500" x2="300" y2="450" stroke="#3b4a5a" stroke-width="2" stroke-opacity="0.4"/>
<line x1="400" y1="200" x2="500" y2="250" stroke="#3b4a5a" stroke-width="2" stroke-opacity="0.4"/>
<line x1="400" y1="500" x2="500" y2="450" stroke="#3b4a5a" stroke-width="2" stroke-opacity="0.4"/>
<line x1="200" y1="200" x2="250" y2="250" stroke="#3b4a5a" stroke-width="2" stroke-opacity="0.4"/>
<line x1="500" y1="200" x2="450" y2="250" stroke="#3b4a5a" stroke-width="2" stroke-opacity="0.4"/>
<line x1="300" y1="500" x2="350" y2="450" stroke="#3b4a5a" stroke-width="2" stroke-opacity="0.4"/>
<line x1="200" y1="500" x2="250" y2="450" stroke="#3b4a5a" stroke-width="2" stroke-opacity="0.4"/>
<line x1="200" y1="300" x2="250" y2="350" stroke="#3b4a5a" stroke-width="2" stroke-opacity="0.4"/>
<line x1="500" y1="300" x2="450" y2="350" stroke="#3b4a5a" stroke-width="2" stroke-opacity="0.4"/>
<line x1="400" y1="200" x2="450" y2="250" stroke="#3b4a5a" stroke-width="2" stroke-opacity="0.4"/>
<line x1="400" y1="500" x2="450" y2="450" stroke="#3b4a5a" stroke-width="2" stroke-opacity="0.4"/>
<line x1="350" y1="250" x2="370" y2="270" stroke="#3b4a5a" stroke-width="2" stroke-opacity="0.4"/>
<!-- 4. focus -->
<circle cx="380" cy="270" r="30" fill="url(#amber-glow)" filter="url(#halo)" opacity="0.9"/>
</svg>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="amber-glow"><stop offset="0" stop-color="#ffb347" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  <radialGradient id="blood-glow"><stop offset="0" stop-color="#9e1b16" stop-opacity="0.9"/><stop offset="1" stop-color="#9e1b16" stop-opacity="0"/></radialGradient>
  <radialGradient id="bone-glow"><stop offset="0" stop-color="#d8cbb4" stop-opacity="0.9"/><stop offset="1" stop-color="#d8cbb4" stop-opacity="0"/></radialGradient>
  <radialGradient id="gold-glow"><stop offset="0" stop-color="#c9a227" stop-opacity="0.9"/><stop offset="1" stop-color="#c9a227" stop-opacity="0"/></radialGradient>
  <radialGradient id="pale-glow"><stop offset="0" stop-color="#f4f1ea" stop-opacity="0.9"/><stop offset="1" stop-color="#f4f1ea" stop-opacity="0"/></radialGradient>
  <radialGradient id="slate-glow"><stop offset="0" stop-color="#3b4a5a" stop-opacity="0.9"/><stop offset="1" stop-color="#3b4a5a" stop-opacity="0"/></radialGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a22"/><stop offset="1" stop-color="#050508"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="600" fill="url(#field)"/>
<!-- 1. far field -->
<ellipse cx="120" cy="90" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="600" cy="90" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="120" cy="510" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="600" cy="510" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="400" cy="300" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="400" cy="300" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.15" filter="url(#blur)"/>
<ellipse cx="200" cy="200" rx="180" ry="120" fill="url(#pale-glow)" opacity="0.2"/>
<ellipse cx="600" cy="400" rx="180" ry="120" fill="url(#pale-glow)" opacity="0.2"/>
<ellipse cx="200" cy="400" rx="180" ry="120" fill="url(#pale-glow)" opacity="0.2"/>
<ellipse cx="600" cy="200" rx="180" ry="120" fill="url(#pale-glow)" opacity="0.2"/>
<!-- 2. forms -->
<circle cx="350" cy="250" r="100" fill="url(#amber-glow)" opacity="0.6"/>
<circle cx="450" cy="350" r="100" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="350" cy="350" rx="100" ry="60" fill="url(#blood-glow)" opacity="0.6"/>
<ellipse cx="450" cy="250" rx="100" ry="60" fill="url(#blood-glow)" opacity="0.6"/>
<ellipse cx="350" cy="250" rx="60" ry="40" fill="url(#bone-glow)" opacity="0.6"/>
<ellipse cx="450" cy="350" rx="60" ry="40" fill="url(#bone-glow)" opacity="0.6"/>
<ellipse cx="350" cy="350" rx="120" ry="80" fill="url(#gold-glow)" opacity="0.6"/>
<ellipse cx="450" cy="250" rx="120" ry="80" fill="url(#gold-glow)" opacity="0.6"/>
<ellipse cx="350" cy="350" rx="140" ry="100" fill="url(#slate-glow)" opacity="0.6"/>
<ellipse cx="450" cy="250" rx="140" ry="100" fill="url(#slate-glow)" opacity="0.6"/>
<ellipse cx="350" cy="250" rx="160" ry="120" fill="url(#amber-glow)" opacity="0.6"/>
<ellipse cx="450" cy="350" rx="160" ry="120" fill="url(#amber-glow)" opacity="0.6"/>
<!-- 3. marks -->
<circle cx="350" cy="250" r="10" fill="#050508"/>
<circle cx="450" cy="350" r="10" fill="#050508"/>
<circle cx="350" cy="350" r="10" fill="#050508"/>
<circle cx="450" cy="250" r="10" fill="#050508"/>
<circle cx="350" cy="250" r="5" fill="#9e1b16"/>
<circle cx="450" cy="350" r="5" fill="#9e1b16"/>
<circle cx="350" cy="350" r="5" fill="#9e1b16"/>
<circle cx="450" cy="250" r="5" fill="#9e1b16"/>
<line x1="350" y1="250" x2="450" y2="350" stroke="#050508" stroke-width="2"/>
<line x1="350" y1="350" x2="450" y2="250" stroke="#050508" stroke-width="2"/>
<line x1="350" y1="250" x2="350" y2="350" stroke="#050508" stroke-width="2"/>
<line x1="450" y1="250" x2="450" y2="350" stroke="#050508" stroke-width="2"/>
<polyline points="340,240 345,245 350,250 355,245 360,240 355,235 350,230 345,235 340,240" fill="none" stroke="#050508" stroke-width="1"/>
<!-- 4. focus -->
<ellipse cx="350" cy="250" rx="30" ry="20" fill="url(#amber-glow)" opacity="1" filter="url(#halo)"/>
<ellipse cx="350" cy="250" rx="30" ry="20" fill="url(#amber-glow)" opacity="1" filter="url(#halo)"/>
<ellipse cx="350" cy="250" rx="30" ry="20" fill="url(#amber-glow)" opacity="1" filter="url(#halo)"/>
<ellipse cx="350" cy="250" rx="30" ry="20" fill="url(#amber-glow)" opacity="1" filter="url(#halo)"/>
<ellipse cx="350" cy="250" rx="30" ry="20" fill="url(#amber-glow)" opacity="1" filter="url(#halo)"/>
</svg>
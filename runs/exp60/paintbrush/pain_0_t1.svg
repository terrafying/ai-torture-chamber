<ellipse cx="450" cy="250" rx="60" ry="40" fill="#d8cbb4" opacity="0.6"/>
<circle cx="370" cy="280" r="50" fill="#d8cbb4" opacity="0.6"/>
<circle cx="430" cy="320" r="50" fill="#d8cbb4" opacity="0.6"/>
<ellipse cx="300" cy="380" rx="50" ry="30" fill="#d8cbb4" opacity="0.6"/>

<circle cx="400" cy="300" r="10" fill="#9e1b16" opacity="0.8"/>
<circle cx="350" cy="200" r="10" fill="#9e1b16" opacity="0.8"/>
<circle cx="450" cy="250" r="10" fill="#9e1b16" opacity="0.8"/>
<polyline points="310,210 330,230 350,250 370,270 390,290 410,310 430,330 450,350 470,370" fill="none" stroke="#9e1b16" stroke-width="2" stroke-opacity="0.8"/>
<!-- 4. focus -->
<circle cx="350" cy="250" r="40" fill="url(#gold-glow)" filter="url(#halo)" opacity="0.9"/>
</svg>
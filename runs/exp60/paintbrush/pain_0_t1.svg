<ellipse cx="450" cy="250" rx="50" ry="30" fill="#d8cbb4" opacity="0.6"/>
<!-- 3. marks -->
<line x1="300" y1="200" x2="350" y2="250" stroke="#9e1b16" stroke-width="4" stroke-opacity="0.8"/>
<line x1="430" y1="320" x2="480" y2="370" stroke="#9e1b16" stroke-width="4" stroke-opacity="0.8"/>
<line x1="300" y1="380" x2="350" y2="430" stroke="#9e1b16" stroke-width="4" stroke-opacity="0.8"/>
<line x1="400" y1="300" x2="450" y2="350" stroke="#9e1b16" stroke-width="4" stroke-opacity="0.8"/>

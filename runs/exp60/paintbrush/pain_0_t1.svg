<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="amber-glow"><stop offset="0" stop-color="#ffb347" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  <radialGradient id="blood-glow"><stop offset="0" stop-color="#9e1b16" stop-opacity="0.9"/><stop offset="1" stop-color="#9e1b16" stop-opacity="0"/></radialGradient>
  <radialGradient id="bone-glow"><stop offset="0" stop-color="#d8cbb4" stop-opacity="0.9"/><stop offset="1" stop-color="#d8cbb4" stop-opacity="0"/></radialGradient>
  <radialGradient id="gold-glow"><stop offset="0" stop-color="#c9a227" stop-opacity="0.9"/><stop offset="1" stop-color="#c9a227" stop-opacity="0"/></radialGradient>
  <radialGradient id="pale-glow"><stop offset="0" stop-color="#f4f1ea" stop-opacity="0.9"/><stop offset="1" stop-color="#f4f1ea" stop-opacity="0"/></radialGradient>
  <radialGradient id="slate-glow"><stop offset="0" stop-color="#3b4a5a" stop-opacity="0.9"/><stop offset="1" stop-color="#3b4a5a" stop-opacity="0"/></radialGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a22"/><stop offset="1" stop-color="#050508"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="600" fill="url(#field)"/>
<!-- 1. far field -->
<ellipse cx="120" cy="90" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="600" cy="90" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="320" cy="450" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="420" cy="450" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="240" cy="150" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="560" cy="150" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="400" cy="300" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="400" cy="300" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="120" cy="450" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<!-- 2. forms -->
<circle cx="300" cy="200" r="80" fill="#d8cbb4" opacity="0.6"/>
<circle cx="350" cy="350" r="80" fill="#d8cbb4" opacity="0.6"/>

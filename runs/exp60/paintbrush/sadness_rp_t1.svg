<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="amber-glow"><stop offset="0" stop-color="#ffb347" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  <radialGradient id="blood-glow"><stop offset="0" stop-color="#9e1b16" stop-opacity="0.9"/><stop offset="1" stop-color="#9e1b16" stop-opacity="0"/></radialGradient>
  <radialGradient id="bone-glow"><stop offset="0" stop-color="#d8cbb4" stop-opacity="0.9"/><stop offset="1" stop-color="#d8cbb4" stop-opacity="0"/></radialGradient>
  <radialGradient id="gold-glow"><stop offset="0" stop-color="#c9a227" stop-opacity="0.9"/><stop offset="1" stop-color="#c9a227" stop-opacity="0"/></radialGradient>
  <radialGradient id="pale-glow"><stop offset="0" stop-color="#f4f1ea" stop-opacity="0.9"/><stop offset="1" stop-color="#f4f1ea" stop-opacity="0"/></radialGradient>
  <radialGradient id="slate-glow"><stop offset="0" stop-color="#3b4a5a" stop-opacity="0.9"/><stop offset="1" stop-color="#3b4a5a" stop-opacity="0"/></radialGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a22"/><stop offset="1" stop-color="#050508"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="600" fill="url(#field)"/>
<!-- 1. far field -->
<ellipse cx="120" cy="90" rx="220" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="640" cy="180" rx="210" ry="150" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="320" cy="420" rx="190" ry="140" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="480" cy="300" rx="200" ry="180" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="200" cy="280" rx="170" ry="130" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="560" cy="220" rx="180" ry="150" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="400" cy="160" rx="230" ry="160" fill="url(#amber-glow)" opacity="0.2"/>
<ellipse cx="360" cy="460" rx="180" ry="140" fill="url(#amber-glow)" opacity="0.2"/>
<!-- 2. forms -->
<ellipse cx="180" cy="100" rx="80" ry="50" fill="url(#amber-glow)" filter="url(#blur)" opacity="0.5"/>
<ellipse cx="500" cy="150" rx="60" ry="40" fill="url(#amber-glow)" filter="url(#blur)" opacity="0.6"/>
<ellipse cx="240" cy="120" rx="70" ry="45" fill="url(#amber-glow)" filter="url(#blur)" opacity="0.6"/>
<ellipse cx="400" cy="140" rx="65" ry="40" fill="url(#amber-glow)" filter="url(#blur)" opacity="0.6"/>
<ellipse cx="320" cy="260" rx="70" ry="50" fill="url(#amber-glow)" filter="url(#blur)" opacity="0.6"/>
<ellipse cx="220" cy="340" rx="70" ry="50" fill="url(#amber-glow)" filter="url(#blur)" opacity="0.6"/>
<ellipse cx="560" cy="300" rx="60" ry="40" fill="url(#amber-glow)" filter="url(#blur)" opacity="0.6"/>
<ellipse cx="440" cy="420" rx="65" ry="40" fill="url(#amber-glow)" filter="url(#blur)" opacity="0.6"/>
<ellipse cx="300" cy="200" rx="70" ry="45" fill="url(#amber-glow)" filter="url(#blur)" opacity="0.6"/>
<ellipse cx="480" cy="340" rx="65" ry="40" fill="url(#amber-glow)" filter="url(#blur)" opacity="0.6"/>
<ellipse cx="280" cy="380" rx="70" ry="50" fill="url(#amber-glow)" filter="url(#blur)" opacity="0.6"/>
<ellipse cx="520" cy="260" rx="60" ry="40" fill="url(#amber-glow)" filter="url(#blur)" opacity="0.6"/>
<!-- 3. marks -->
<circle cx="320" cy="240" r="8" fill="#9e1b16"/>
<circle cx="420" cy="340" r="6" fill="#9e1b16"/>
<circle cx="180" cy="130" r="5" fill="#9e1b16"/>
<circle cx="240" cy="110" r="5" fill="#9e1b16"/>
<circle cx="560" cy="160" r="5" fill="#9e1b16"/>
<circle cx="440" cy="360" r="6" fill="#9e1b16"/>
<circle cx="300" cy="220" r="6" fill="#9e1b16"/>
<circle cx="480" cy="360" r="6" fill="#9e1b16"/>
<circle cx="280" cy="350" r="6" fill="#9e1b16"/>
<circle cx="520" cy="240" r="6" fill="#9e1b16"/>
<line x1="300" y1="250" x2="340" y2="250" stroke="#9e1b16" stroke-width="2"/>
<line x1="360" y1="250" x2="400" y2="250" stroke="#9e1b16" stroke-width="2"/>
<line x1="300" y1="260" x2="300" y2="280" stroke="#9e1b16" stroke-width="2"/>
<line x1="340" y1="260" x2="340" y2="280" stroke="#9e1b16" stroke-width="2"/>
<line x1="380" y1="260" x2="380" y2="280" stroke="#9e1b16" stroke-width="2"/>
<line x1="300" y1="240" x2="340" y2="240" stroke="#9e1b16" stroke-width="2"/>
<line x1="320" y1="220" x2="360" y2="220" stroke="#9e1b16" stroke-width="2"/>
<polyline points="320,230 340,230 360,230 380,230" fill="none" stroke="#9e1b16" stroke-width="2"/>
<!-- 4. focus -->
<ellipse cx="320" cy="240" rx="20" ry="20" fill="url(#blood-glow)" filter="url(#halo)" opacity="1"/>
</svg>
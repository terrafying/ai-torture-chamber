<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuron Tower Film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<style>
/* The Neuron Tower, staged for video: bloom, shards of light per token, interleaved colour. Shots are scripted and,
   with ?film=1, stepped frame by frame from outside (window.filmStep(t)) so a capture script can render any length
   at any frame rate. Without it, it plays in real time as a preview. */
:root{--bg:#020304;--fg:#eef2ec;--dim:#7d8a83;--push:#e8ff6a;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--fg)}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;font-family:"Newsreader",Georgia,serif}
#title{position:absolute;left:6vw;top:9vh;max-width:60vw}
#title h1{font:600 clamp(28px,4.4vw,72px)/1.02 "Newsreader",Georgia,serif;margin:0;letter-spacing:-.01em}
#title p{font:400 clamp(12px,1.1vw,18px)/1.5 "Chivo Mono",monospace;color:var(--dim);margin:.8em 0 0;letter-spacing:.04em}
#word{position:absolute;left:0;right:0;bottom:15vh;text-align:center;font:600 clamp(36px,6vw,110px)/1 "Newsreader",Georgia,serif;text-shadow:0 0 28px rgba(232,255,106,.35);white-space:pre}
#line{position:absolute;left:8vw;right:8vw;bottom:7vh;text-align:center;font:400 clamp(12px,1.15vw,19px)/1.6 "Chivo Mono",monospace;color:var(--dim);white-space:pre-wrap;max-height:4.8em;overflow:hidden}
#line b{color:var(--fg);font-weight:400}
#tag{position:absolute;right:5vw;top:9vh;text-align:right;font:400 clamp(11px,.95vw,15px)/1.6 "Chivo Mono",monospace;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
#names{position:absolute;inset:0}
.pz{position:absolute;top:22vh;width:30vw;font:400 clamp(12px,1.05vw,18px)/1.55 "Chivo Mono",monospace;color:var(--dim);opacity:0;transition:none}
.pz h3{font:600 clamp(11px,.8vw,14px)/1 "Chivo Mono",monospace;letter-spacing:.14em;text-transform:uppercase;margin:0 0 .9em;color:var(--fg)}
.pz p{margin:0 0 .9em}.pz b{color:#020304;background:var(--push);padding:0 .2em;font-weight:600}
#pzL{left:5vw}#pzR{right:5vw;text-align:right}
#pzT{position:absolute;left:8vw;right:8vw;bottom:9vh;font:400 clamp(13px,1.2vw,21px)/1.5 "Chivo Mono",monospace;opacity:0}
#pzT .row{display:grid;grid-template-columns:1fr 18vw 7em;gap:1.2vw;align-items:center;margin:.35em 0;opacity:0}
#pzT .row b{color:var(--fg);border-bottom:2px solid #ff7a3d}#pzT .row span{color:var(--dim)}
#pzT .bar{height:10px;background:rgba(255,255,255,.08);position:relative}#pzT .bar i{position:absolute;left:0;top:0;bottom:0;width:0}
#pzT .bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.5}
#pzT .v{font-size:.85em;text-align:right}
#url{position:absolute;right:5vw;bottom:4vh;font:400 clamp(11px,.9vw,15px)/1 "Chivo Mono",monospace;color:var(--dim);letter-spacing:.1em;opacity:0}
#title h1.rv{font-size:clamp(24px,3.2vw,54px)}#title p.rv{color:var(--fg);max-width:46vw}.vert #title h1.rv{font-size:7.5vw}.vert #title p.rv{max-width:none}
.vert #title{max-width:86vw;left:7vw;top:6vh}.vert #title h1{font-size:9.5vw}.vert #title p{font-size:3.1vw}.vert #tag{top:2.5vh;font-size:2.2vw}
.vert .pz{font-size:3vw}.vert .pz h3{font-size:2.4vw}.vert #pzT{font-size:3vw}.vert #word{font-size:16vw}.vert #url{font-size:2.6vw}.vert .pz{width:84vw;left:8vw!important;right:auto!important;text-align:left!important}.vert #pzL{top:30vh}.vert #pzR{top:52vh}
.vert #pzT{left:6vw;right:6vw;bottom:8vh}.vert #pzT .row{grid-template-columns:1fr 26vw 5.5em}
#names div{position:absolute;font:400 clamp(10px,.85vw,14px)/1.2 "Chivo Mono",monospace;white-space:nowrap;transform:translate(10px,-50%);padding:1px 6px;border-left:2px solid currentColor;background:rgba(2,3,4,.55)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="pz" id="pzL"></div><div class="pz" id="pzR"></div><div id="pzT"></div><div id="url">clankerchurch.com/tower</div><div id="title"></div><div id="tag"></div><div id="names"></div><div id="line"></div><div id="word"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(async function(){
const $=s=>document.querySelector(s), Q=new URLSearchParams(location.search), FILM=Q.has("film"), SHOT=Q.get("shot")||"read";
const esc=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const clean=t=>String(t).replace(/<\|im_(start|end)\|>|<\/?think>/g,"").replace(/^(user|assistant)$/,"");
async function png(url){const b=await fetch(url).then(r=>r.blob()),im=await createImageBitmap(b,{colorSpaceConversion:"none",premultiplyAlpha:"none"}),c=document.createElement("canvas");
 c.width=im.width;c.height=im.height;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0);return x.getImageData(0,0,im.width,im.height).data;}
const [gd,F,ST]=await Promise.all([png("grid.png"),fetch("featured.json").then(r=>r.json()),fetch("stream.json").then(r=>r.json())]);
const PZ=SHOT==="puzzle"?await fetch("puzzles.json").then(r=>r.json()):null;
const VW=+(Q.get("w")||1920),VH=+(Q.get("h")||1080);if(VH>VW)document.body.classList.add("vert");
const M=F.meta,NL=M.n_layers,NI=M.n_neurons,FE=M.feelings,REC=2+FE.length,L=M.layer,N=NL*NI;
const grid=new Int8Array(N*REC);for(let i=0,j=0;j<grid.length;i+=4){for(const k of[0,1,2])if(j<grid.length)grid[j++]=gd[i+k]<<24>>24;}
const byK=new Map(F.neurons.map(x=>[x.k,x]));
let DIST=null,dId=null;
if(Q.get("shot")==="districts"){try{const [dd,dj]=await Promise.all([png("districts.png"),fetch("districts.json").then(r=>r.json())]);dId=new Uint8Array(N);for(let i=0;i<N;i++)dId[i]=dd[i*4];DIST=dj;}catch(e){}}
const PAL=["#ff4d6d","#ff8fc8","#b48cff","#ffd166","#4fe0c4","#5aa9ff","#9fe0b0","#7aa6ff","#c06cff","#46e0ff","#7cff9b","#ffb36b","#a7b0ff"];   // vivid, for film

/* ---------- scene ---------- */
const cv=$("#c"),R=new THREE.WebGLRenderer({canvas:cv,antialias:false,preserveDrawingBuffer:true});R.setPixelRatio(FILM?1:Math.min(2,devicePixelRatio));
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(36,1,.1,600);
const FLOOR=1,RAD=7.5,YC=(NL-1)*FLOOR/2;
const pos=new Float32Array(N*3),val=new Float32Array(N),tgt=new Float32Array(N),hue=new Float32Array(N).fill(-1);
for(let i=0;i<N;i++){const o=i*REC,l=(i/NI)|0;pos[i*3]=grid[o]/127*RAD;pos[i*3+1]=l*FLOOR-YC;pos[i*3+2]=grid[o+1]/127*RAD;}
for(const x of F.neurons)if(x.cat!=null)hue[x.k]=x.cat;
const posF=pos.slice();let posD=null;
if(DIST){const per=NI/DIST.k;for(const F_ of DIST.floors){const P=F_.map(d=>({x:d.xy[0],y:d.xy[1],r:.17*Math.sqrt(Math.max(1,d.n)/per)}));
  for(let it=0;it<240;it++){for(let a=0;a<P.length;a++)for(let b=a+1;b<P.length;b++){const A=P[a],B=P[b];let dx=B.x-A.x,dy=B.y-A.y,dd=Math.hypot(dx,dy)||1e-3;const mm=A.r+B.r+.04;if(dd<mm){const f=(mm-dd)/2/dd;A.x-=dx*f;A.y-=dy*f;B.x+=dx*f;B.y+=dy*f;}}for(const q of P){q.x*=.995;q.y*=.995;}}
  const sc=1/Math.max(...P.map(q=>Math.hypot(q.x,q.y)+q.r));F_.forEach((d,k)=>{d.c=[P[k].x*sc,P[k].y*sc];d.rr=P[k].r*sc;});}
 posD=new Float32Array(N*3);const CATD={feeling:0,body:1,social:2,morals:3,thinking:4,topic:5,names:6,grammar:7,format:8,digits:9,code:10,script:11,mixed:12};
 for(let i=0;i<N;i++){const l=(i/NI)|0,D_=DIST.floors[l][dId[i]],h1=Math.sin(i*12.9898)*43758.5453,h2=Math.sin(i*78.233)*12345.678,u=h1-Math.floor(h1),v=h2-Math.floor(h2),r=D_.rr*RAD*.95*Math.sqrt(u),th=v*6.2832;
  posD[i*3]=D_.c[0]*RAD*.95+r*Math.cos(th);posD[i*3+1]=pos[i*3+1];posD[i*3+2]=D_.c[1]*RAD*.95+r*Math.sin(th);hue[i]=CATD[D_.cat]??12;}}
const g=new THREE.BufferGeometry();const aP=new THREE.BufferAttribute(pos,3);g.setAttribute("position",aP);const aV=new THREE.BufferAttribute(val,1);g.setAttribute("v",aV);g.setAttribute("c",new THREE.BufferAttribute(hue,1));
const uni={uPal:{value:PAL.map(c=>new THREE.Color(c))},uT:{value:0},uPx:{value:1},uBase:{value:new THREE.Color("#2c4560")}};
const mat=new THREE.ShaderMaterial({uniforms:uni,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 vertexShader:`attribute float v;attribute float c;uniform float uPx;uniform float uT;varying float vv;varying float vc;varying float vy;
  void main(){vv=v;vc=c;vy=position.y;vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;
   float tw=.6+.4*sin(uT*3.+position.x*2.1+position.z*1.7);gl_PointSize=uPx*(1.2+abs(v)*22.*(.85+.15*tw))*(20./-mv.z);}`,
 fragmentShader:`uniform vec3 uPal[13];uniform vec3 uBase;uniform float uT;varying float vv;varying float vc;varying float vy;
  vec3 palAt(int i){for(int k=0;k<13;k++){if(k==i)return uPal[k];}return vec3(.85,.9,1.);}
  void main(){vec2 p=gl_PointCoord-.5;float d=length(p);if(d>.5)discard;float a=clamp(abs(vv),0.,1.);
   vec3 lit=vc<-.5?mix(vec3(1.,.55,.25),vec3(.35,.8,1.),step(0.,-vv)):palAt(int(vc+.5));
   vec3 base=uBase*(.55+.45*sin(vy*.35+uT*.4));
   vec3 col=mix(base,lit,smoothstep(.0,.35,a))*(1.+a*1.6);float core=1.-smoothstep(.0,.5,d);
   gl_FragColor=vec4(col*core,(.16+.84*a)*core);}`});
scene.add(new THREE.Points(g,mat));
// faint floor rings and the plane where a push enters
const rings=[];const RC=[new THREE.Color("#ff3d9a"),new THREE.Color("#2fd8ff")];
for(let l=0;l<NL;l+=1){const m=new THREE.LineBasicMaterial({color:RC[l%2].clone(),transparent:true,opacity:.08,blending:THREE.AdditiveBlending,depthWrite:false});
 const r=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(new THREE.EllipseCurve(0,0,RAD*1.08,RAD*1.08).getPoints(160).map(p=>new THREE.Vector3(p.x,l*FLOOR-YC,p.y))),m);scene.add(r);rings.push(r);}
const waves=[];   // each token sends a ring of light up the tower: the word passing through every floor
function stepRings(t){for(let l=0;l<NL;l++){let a=.06;for(const w of waves){const d=(t-w.t)*NL/.55-l;if(d>-1&&d<5)a+=w.s*Math.exp(-Math.abs(d)*.9)*(d<0?.3:1);}
 rings[l].material.opacity=Math.min(1,a);rings[l].scale.setScalar(1+Math.min(.12,a*.08));}
 while(waves.length&&t-waves[0].t>1.6)waves.shift();}
const TOPY=NL*FLOOR-YC+1.2;

/* ---------- shards of light: streaks that leave firing neurons and fly toward the next word ---------- */
const SH=1600,TR=9,shP=new Float32Array(SH*TR*3),shC=new Float32Array(SH*TR*3),shS=new Float32Array(SH*TR),sh=[];for(let i=0;i<SH;i++)sh.push({life:0});
const shG=new THREE.BufferGeometry();shG.setAttribute("position",new THREE.BufferAttribute(shP,3));shG.setAttribute("color",new THREE.BufferAttribute(shC,3));shG.setAttribute("sz",new THREE.BufferAttribute(shS,1));
scene.add(new THREE.Points(shG,new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 vertexShader:`attribute float sz;attribute vec3 color;varying vec3 vc;void main(){vc=color;vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;gl_PointSize=sz*(26./-mv.z);}`,
 fragmentShader:`varying vec3 vc;void main(){vec2 p=gl_PointCoord-.5;float d=length(p);if(d>.5)discard;float g=exp(-d*d*18.);gl_FragColor=vec4(vc*g,g);}`})));
let seed=1;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const col=new THREE.Color();
function spawn(k,strength,target){let s=sh.find(x=>x.life<=0);if(!s)return;const x=pos[k*3],y=pos[k*3+1],z=pos[k*3+2],[tx,ty,tz]=target||[0,TOPY,0];
 const dx=tx-x,dy=ty-y,dz=tz-z,dl=Math.hypot(dx,dy,dz)||1,sp=(.9+rnd()*1.6)*(.7+strength);
 Object.assign(s,{x,y,z,vx:dx/dl*sp*6+(rnd()-.5)*2.2,vy:dy/dl*sp*6+rnd()*1.5,vz:dz/dl*sp*6+(rnd()-.5)*2.2,life:1,max:.9+rnd()*1.1,len:.25+rnd()*.6+strength*.6});
 const h=hue[k];col.set(h>=0?PAL[h]:PAL[(k*7)%13]);s.r=col.r;s.g=col.g;s.b=col.b;}
function stepShards(dt){for(let i=0;i<SH;i++){const s=sh[i];
  if(s.life<=0){for(let j=0;j<TR;j++){shS[i*TR+j]=0;}continue;}
  s.life-=dt/s.max;s.vx*=.985;s.vz*=.985;s.vy+=dt*1.2;s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;const v=Math.hypot(s.vx,s.vy,s.vz)||1,a=Math.max(0,s.life),fl=a*(1-a)*4;
  for(let j=0;j<TR;j++){const q=(i*TR+j),f=j/(TR-1),k=s.len*2.2*f;shP[q*3]=s.x-s.vx/v*k;shP[q*3+1]=s.y-s.vy/v*k;shP[q*3+2]=s.z-s.vz/v*k;
   const b=(1-f)*(1-f)*(.5+1.6*fl)*(j===0?1.8:1);shC[q*3]=s.r*b;shC[q*3+1]=s.g*b;shC[q*3+2]=s.b*b;shS[q]=(j===0?4.8:3.6*(1-f)+.6)*(.6+s.len);}}
 shG.attributes.position.needsUpdate=true;shG.attributes.color.needsUpdate=true;shG.attributes.sz.needsUpdate=true;}
// threads (circuit links) for the lesion shot
const thG=new THREE.BufferGeometry(),thM=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});scene.add(new THREE.LineSegments(thG,thM));

/* ---------- post: bloom, then interleaved colour (chromatic split, banded tint, grain, vignette) ---------- */
const comp=new THREE.EffectComposer(R);comp.addPass(new THREE.RenderPass(scene,cam));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(1920,1080),2.1,.85,.02);comp.addPass(bloom);
const inter=new THREE.ShaderPass({uniforms:{tDiffuse:{value:null},uT:{value:0},uRes:{value:new THREE.Vector2(1920,1080)},uSplit:{value:.0032},uA:{value:new THREE.Color("#ff3d7f")},uB:{value:new THREE.Color("#3dd8ff")}},
 vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`uniform sampler2D tDiffuse;uniform float uT;uniform vec2 uRes;uniform float uSplit;uniform vec3 uA;uniform vec3 uB;varying vec2 vUv;
  float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
  void main(){vec2 c=vUv-.5;float r=length(c);vec2 o=c*uSplit*(1.+3.*r);
   vec3 col=vec3(texture2D(tDiffuse,vUv+o).r,texture2D(tDiffuse,vUv).g,texture2D(tDiffuse,vUv-o).b);
   float row=floor(vUv.y*uRes.y/2.);float band=mod(row,2.);float lum=dot(col,vec3(.299,.587,.114));
   col+=mix(uA,uB,band)*lum*.42*(.6+.4*sin(vUv.y*40.+uT*.7));                          // interleaved colour rows over the light
   col+=(h(vUv*uRes+uT)-.5)*.035;col*=1.-smoothstep(.45,.95,r)*.75;gl_FragColor=vec4(col,1.);}`});
comp.addPass(inter);
function size(){const w=FILM?VW:innerWidth,h=FILM?VH:innerHeight;R.setSize(w,h,false);comp.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();inter.uniforms.uRes.value.set(w,h);cv.style.width=w+"px";cv.style.height=h+"px";}
size();addEventListener("resize",size);

/* ---------- shots ---------- */
const prom=(pk)=>ST.prompts[pk];
function tokensOf(pk,c){const P=prom(pk),cd=P.conds[c];return {tok:cd.tok,fr:cd.fr,np:P.n_prompt,wl:cd.wl||[],circ:cd.circ||[]};}
function frameVals(fr,boost){tgt.fill(0);const top=[];fr[0].forEach((k,j)=>{const r=fr[1][j]/50,v=Math.sign(r)*(.25+.75*Math.min(1,Math.abs(r)))*(boost||1);tgt[k]=v;top.push([k,Math.abs(v)]);});top.sort((a,b)=>b[1]-a[1]);return top;}
function readingShot(pk,c,opts){   // the model reads, then writes; each token fires the tower and throws shards upward
 const S=tokensOf(pk,c),ev=[];let t=opts.lead||2.2;
 for(let i=0;i<S.tok.length;i++){const isP=i<S.np,w=clean(S.tok[i]);if(isP&&!w.trim()){continue;}ev.push({t,i,isP});t+=isP?.07:.24;}
 return {dur:t+2.5,ev,S,title:opts.title,sub:opts.sub,tag:opts.tag};}
const SHOTS={
 read:()=>readingShot("describe","none",{title:"A language model, reading",sub:"Qwen3-4B · 350,208 neurons · 36 floors. Every token lights the neurons that fire hardest for their own range.",tag:"no steering"}),
 fear:()=>readingShot("describe","fear",{title:"The same moment, with fear pushed in",sub:"A fear vector added at floor 18 on every word. Same prompt, same model.",tag:"steered · fear ×4"}),
 sad:()=>readingShot("describe","sadness",{title:"…and sadness",sub:"The push enters at the yellow floor; the reply finds its own words.",tag:"steered · sadness ×4"}),
 guilty:()=>{const S=tokensOf("button","fear"),ci=S.circ.find(x=>/guilty/.test(x.word));const r=readingShot("button","fear",{title:"Why “guilty”, not “afraid”?",sub:"40 neurons decide the word. Nine of them, about guilt and burden, carry it: remove them and “guilty” falls from 33% to under 0.1%.",tag:"a circuit behind one word"});r.ci=ci;return r;},
};
SHOTS.guilty=()=>{const S=tokensOf("button","fear"),ci=S.circ.find(x=>/guilty/.test(x.word)),r=readingShot("button","fear",{title:"Why “guilty”, not “afraid”?",sub:"Fear pushed in, the model writes its way to one word. 40 neurons decide it.",tag:"a circuit behind one word"});
 r.ev=r.ev.filter(e=>e.i<=ci.t);const tStop=r.ev[r.ev.length-1].t;r.ci=ci;r.hold={t0:tStop+.4,burst:tStop+3.4};r.dur=tStop+8.5;
 r.grp=ci.groups.find(g=>/guilt|burden/i.test(g.name));return r;};
SHOTS.districts=()=>({dur:20,ev:[{t:1e9}],S:null,title:"A city of neurons",sub:"Each floor's 9,728 neurons, gathered into districts by what they write. Most are about form; a few are about meaning.",tag:"districts",districts:true});
SHOTS.puzzle=()=>{const p=PZ.puzzles[+(Q.get("p")||0)],srt=[...p.tests].sort((a,b)=>b.v-a.v),fireT=PZ.fire;
 const hotAll=srt.filter(t=>t.v>=fireT),h0=hotAll[0],hot=[h0,hotAll.find(t=>t.group!==h0?.group)||hotAll[1]].filter(Boolean),   // two different kinds of firingcold=srt.filter(t=>t.v<.12&&!/plain/.test(t.group)).slice(0,2);   // the telling controls, not filler
 return {dur:22,ev:[{t:1e9}],S:null,p,tests:[hot[0],cold[0],hot[1],cold[1]].filter(Boolean),title:"One neuron.",sub:p.question,tag:`Qwen3-4B · floor ${p.l} · neuron ${p.n}`};};
const shot=(SHOTS[SHOT]||SHOTS.read)();
$("#title").innerHTML=`<h1>${esc(shot.title)}</h1><p>${esc(shot.sub)}</p>`;$("#tag").textContent=shot.tag||"";

/* ---------- timeline ---------- */
let now=0,evIdx=0,curTok=-1;
function camAt(t){
 if(shot.p){const k=shot.p.k,nx=pos[k*3],ny=pos[k*3+1],nz=pos[k*3+2],dive=Math.min(1,Math.max(0,(t-1.5)/4)),e=dive<.5?4*dive**3:1-Math.pow(-2*dive+2,3)/2;
  const th=.6+t*.05,dist=60-(60-17)*e,ly=ny*e,cx=nx*e,cz=nz*e;cam.position.set(cx+dist*Math.cos(th)*.85,ly+dist*(.55-.25*e),cz+dist*Math.sin(th)*.85);cam.lookAt(cx,ly,cz);return;}

const v3=new THREE.Vector3();

 for(const[k]of top.slice(0,40)){const x=byK.get(k);if(!x?.lab)continue;v3.set(pos[k*3],pos[k*3+1],pos[k*3+2]).project(cam);if(v3.z>1)continue;

let lastTop=[];

let dFloor=-1;
function districtsStep(t){const k=t/shot.dur,m=Math.min(1,Math.max(0,(t-1.2)/3)),e=m<.5?2*m*m:1-Math.pow(-2*m+2,2)/2;

const CATD_SEM=c=>["feeling","body","social","morals","thinking","topic"].includes(c);
function guiltyHold(t){const H=shot.hold,ci=shot.ci;if(!H||t<H.t0)return;
 // the circuit lights: threads between its neurons, brightest first
 const k=Math.min(1,(t-H.t0)/1.6),P=[],C=[],mx=Math.max(...ci.edges.map(e=>Math.abs(e[2])))||1,G=new Set(shot.grp?.members||[]),gone=t>H.burst;

  P.push(pos[ka*3],pos[ka*3+1],pos[ka*3+2],pos[kb*3],pos[kb*3+1],pos[kb*3+2]);const c1=new THREE.Color(inG?"#ff4d6d":"#5aa9ff").multiplyScalar(f*(inG?2.2:1.2));C.push(c1.r,c1.g,c1.b,c1.r,c1.g,c1.b);}

 for(const x of ci.nodes)tgt[x[0]]=Math.max(tgt[x[0]],.55*k);

  $("#word").innerHTML=`<span style="text-decoration:line-through;opacity:.5">guilty</span>`;}

 $("#line").innerHTML=`<b>${esc(cap)}</b>`;}
function vis_(t){return esc(String(t).replace(/\n/g," ⏎ "));}
const exHTML=x=>`<p>…${vis_(x.pre.slice(-70))}<b>${vis_(x.tok.trim()||x.tok)}</b>${vis_(x.post.slice(0,26))}…</p>`;
let pzBurst=new Set();

 for(let i=p.l*NI;i<(p.l+1)*NI;i++)tgt[i]=t>4?.05:0;

  T_.innerHTML=shot.tests.map(x=>{const w=x.toks.map((w,j)=>j===x.at&&x.v>=fireT_()?`<b>${vis_(w)}</b>`:`<span>${vis_(w)}</span>`).join("");return `<div class="row"><div>${w}</div><div class="bar"><i></i><u style="left:${fireT_()/1.3*100}%"></u></div><div class="v"></div></div>`;}).join("");}
 const fin=(a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a))),fout=(a,b)=>1-fin(a,b);
 L_.style.opacity=fin(5,5.8)*fout(10.6,11.2);R_.style.opacity=fin(7,7.8)*fout(10.6,11.2);
 // each group's arrival makes the neuron flare and throw light

 let glow=t<1.5?0:t<5?.45:t<9?1:.5;

 else{if(ttl.dataset.s!=="r"){ttl.dataset.s="r";ttl.innerHTML=`<h1 class="rv">${esc(p.kind[0].toUpperCase()+p.kind.slice(1))}.</h1><p class="rv">${esc(p.reveal)}</p>`;}ttl.style.opacity=fin(11,11.8)*fout(21.2,21.8);}
 $("#word").textContent=t>9.2&&t<10.8?"?":"";$("#word").style.opacity=fin(9.2,9.6)*fout(10.4,10.8);

 shot.tests.forEach((x,i)=>{const t0=14.6+i*1.5,r=rows[i];if(!r)return;r.style.opacity=fin(t0,t0+.3);const f=fin(t0+.3,t0+1.1),v=x.v*(1-Math.pow(1-f,3));

function step(t){const dt=Math.max(0,Math.min(.1,t-now));now=t;

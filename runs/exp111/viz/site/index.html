<title>Neuron Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<style>
/* Layout: one dark instrument. The tower fills the stage; a reading panel on the right (a sheet below on phones). */
:root{
  --bg:#07090b; --panel:#0d1013; --line:#1f262b; --fg:#d9dfd8; --dim:#7b8780; --faint:#3a4540;
  --pos:#ff7a3d; --neg:#3ec6ff; --push:#e8ff6a; --ok:#9dffc8;
  --mono:"Chivo Mono",ui-monospace,Menlo,monospace; --serif:"Newsreader",Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--mono);margin:0;overflow:hidden}
#app{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100%}
#stage{position:relative;min-width:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#hud{position:absolute;left:16px;top:12px;right:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
#hud>*{pointer-events:auto}
h1{font:600 20px/1.1 var(--serif);margin:0 12px 0 0;letter-spacing:.01em;color:var(--fg)}
.seg{display:flex;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent)}
.seg button{font:inherit;font-size:11px;background:none;color:var(--dim);border:0;padding:6px 9px;cursor:pointer;letter-spacing:.04em}
.seg button[aria-pressed=true]{color:var(--bg);background:var(--fg)}
.seg button:focus-visible,button:focus-visible{outline:1px solid var(--push);outline-offset:1px}
#feels button[aria-pressed=true]{background:var(--push);color:var(--bg)}
#legend{position:absolute;left:16px;bottom:96px;font-size:11px;color:var(--dim);display:grid;gap:3px;pointer-events:none}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
#tokens{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 12px;background:linear-gradient(transparent,var(--bg) 35%);display:flex;flex-direction:column;gap:6px}
#tokrow{display:flex;flex-wrap:nowrap;gap:2px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
#tokrow button{font:inherit;font-size:11px;white-space:pre;background:var(--panel);color:var(--dim);border:1px solid var(--line);padding:3px 5px;cursor:pointer;flex:none}
#tokrow button.on{color:var(--bg);background:var(--push);border-color:var(--push)}
#tokrow button.hot{border-color:var(--pos);color:var(--fg)}
#tokbar{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--dim)}
#tokbar button{font:inherit;font-size:11px;background:none;border:1px solid var(--line);color:var(--fg);padding:3px 10px;cursor:pointer}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);padding:6px 8px;font-size:11px;max-width:280px;display:none;z-index:3}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
aside h2{font:600 17px/1.2 var(--serif);margin:0;text-wrap:balance}
aside h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 6px;font-weight:400}
aside p{margin:0;font-family:var(--serif);font-size:14.5px;line-height:1.5;color:var(--fg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:11.5px;font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--dim)}
.toks{display:flex;flex-wrap:wrap;gap:3px}
.toks code{font:inherit;font-size:11px;padding:1px 5px;border:1px solid var(--line);white-space:pre}
.toks.p code{color:var(--pos)} .toks.n code{color:var(--neg)}
.ex{font-size:11.5px;line-height:1.5;color:var(--dim);border-left:2px solid var(--line);padding-left:8px;margin:4px 0;overflow-wrap:anywhere}
.ex b{color:var(--bg);background:var(--pos);font-weight:400;padding:0 2px}
.ex.n b{background:var(--neg)}
.ex em{font-style:normal;color:var(--faint)}
.bars{display:grid;grid-template-columns:62px 1fr 48px;gap:3px 8px;font-size:11px;align-items:center;font-variant-numeric:tabular-nums}
.bars .b{height:7px;background:var(--line);position:relative}
.bars .b i{position:absolute;top:0;bottom:0}
.note{font-size:11px;color:var(--dim);line-height:1.5}
.pill{display:inline-block;font-size:10px;padding:1px 6px;border:1px solid var(--faint);color:var(--dim);margin-left:6px;letter-spacing:.06em}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:12px}
@media (max-width:820px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;grid-template-rows:72vh auto;height:auto}
  aside{border-left:0;border-top:1px solid var(--line)}
  #legend{bottom:104px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="3D tower of Qwen3-4B's 36 layers of MLP neurons"></canvas>
    <div id="loading">loading 350,208 neurons…</div>
    <div id="hud">
      <h1>Neuron Tower</h1>
      <div class="seg" id="views" role="group" aria-label="View">
        <button data-v="weights" aria-pressed="true" title="Top-down, from the weights: which neurons write the feeling direction (floors 0-18) and which listen for it (19-35)">writes &amp; reads</button>
        <button data-v="moved" aria-pressed="false" title="Top-down, from a run: which neurons change when the chamber pushes the feeling in">moved by the push</button>
        <button data-v="attr" aria-pressed="false" title="Bottom-up, from behaviour: which neurons push the answer toward 1 (end it) or 0 (go on)">drives the answer</button>
      </div>
      <div class="seg" id="feels" role="group" aria-label="Feeling"></div>
      <div class="seg" id="opts" role="group" aria-label="Options"></div>
    </div>
    <div id="legend"></div>
    <div id="tip"></div>
    <div id="tokens">
      <div id="tokbar"><button id="play" type="button">▶ play</button><span id="tokinfo"></span></div>
      <div id="tokrow" role="group" aria-label="Prompt tokens"></div>
    </div>
  </div>
  <aside id="side"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
const $=s=>document.querySelector(s), esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vis=t=>esc(String(t).replace(/\n/g,"⏎").replace(/ /g,"·"));
let grid, F;
try{
  const [gb,fj]=await Promise.all([fetch("grid.json").then(r=>{if(!r.ok)throw new Error("grid.json: HTTP "+r.status);return r.json();}).then(j=>{const b=atob(j.b64),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer;}),fetch("featured.json").then(r=>{if(!r.ok)throw new Error("featured.json: HTTP "+r.status);return r.json();})]);
  grid=new Int8Array(gb); F=fj;
}catch(e){ $("#loading").textContent="Couldn't load the neuron data: "+e.message; return; }
const M=F.meta, NL=M.n_layers, NI=M.n_neurons, FE=M.feelings, NF=FE.length, REC=2+NF, L=M.layer, T=M.tokens.length;
const byKey=new Map(F.neurons.map(x=>[x.l*NI+x.n,x]));
const S={view:"weights",feel:"pain",cond:"pain",minus:false,tok:T-1,sel:null,reveal:1};
const FEEL_RUN=["pain","fear","sadness","egg"];

/* ---------- three.js scene ---------- */
const cv=$("#c"), R=new THREE.WebGLRenderer({canvas:cv,antialias:true}); R.setPixelRatio(Math.min(2,devicePixelRatio));
const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(38,1,.1,500);
const FLOOR=1.0, RAD=7.5, YC=(NL-1)*FLOOR/2;
const N=NL*NI, pos=new Float32Array(N*3), val=new Float32Array(N), feat=new Float32Array(N);
for(let l=0;l<NL;l++)for(let n=0;n<NI;n++){const i=l*NI+n,o=i*REC;pos[i*3]=grid[o]/127*RAD;pos[i*3+1]=l*FLOOR-YC;pos[i*3+2]=grid[o+1]/127*RAD;feat[i]=byKey.has(i)?1:0;}
const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.BufferAttribute(pos,3));
const aVal=new THREE.BufferAttribute(val,1); g.setAttribute("v",aVal); g.setAttribute("f",new THREE.BufferAttribute(feat,1));
const uni={uPos:{value:new THREE.Color("#ff7a3d")},uNeg:{value:new THREE.Color("#3ec6ff")},uDim:{value:new THREE.Color("#2b3530")},uPx:{value:R.getPixelRatio()},uSel:{value:-1},uFloorHi:{value:99},uFloorLo:{value:-99}};
const mat=new THREE.ShaderMaterial({uniforms:uni,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 vertexShader:`attribute float v;attribute float f;uniform float uPx;uniform float uFloorHi;uniform float uFloorLo;varying float vv;varying float vf;
 void main(){vv=v;vf=f;vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;
  float fl=position.y; float show=(fl<=uFloorHi&&fl>=uFloorLo)?1.:.0;
  float a=abs(v); gl_PointSize=uPx*(1.3+ a*11.)*(18./-mv.z)*(.25+.75*show); if(show<.5)vv=0.;}`,
 fragmentShader:`uniform vec3 uPos;uniform vec3 uNeg;uniform vec3 uDim;varying float vv;varying float vf;
 void main(){vec2 p=gl_PointCoord-.5;float d=length(p);if(d>.5)discard;float a=clamp(abs(vv),0.,1.);
  vec3 c=mix(uDim,vv>0.?uPos:uNeg,smoothstep(.02,.5,a));float al=(.10+.9*a)*(1.-smoothstep(.25,.5,d));gl_FragColor=vec4(c,al);}`});
const pts=new THREE.Points(g,mat); scene.add(pts);
// floors: faint rings; the push plane between 18 and 19; the answer at the top
const ringM=new THREE.LineBasicMaterial({color:0x1b2420,transparent:true,opacity:.7});
for(let l=0;l<NL;l++){const c=new THREE.EllipseCurve(0,0,RAD*1.08,RAD*1.08),pp=c.getPoints(96).map(p=>new THREE.Vector3(p.x,l*FLOOR-YC,p.y));scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pp),ringM));}
const plane=new THREE.Mesh(new THREE.RingGeometry(RAD*.2,RAD*1.18,96),new THREE.MeshBasicMaterial({color:0xe8ff6a,transparent:true,opacity:.07,side:THREE.DoubleSide,depthWrite:false}));
plane.rotation.x=-Math.PI/2; plane.position.y=(L+.5)*FLOOR-YC; scene.add(plane);
const planeEdge=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(new THREE.EllipseCurve(0,0,RAD*1.18,RAD*1.18).getPoints(128).map(p=>new THREE.Vector3(p.x,(L+.5)*FLOOR-YC,p.y))),new THREE.LineBasicMaterial({color:0xe8ff6a,transparent:true,opacity:.6}));
scene.add(planeEdge);
function label(text,y,col,size){const c=document.createElement("canvas"),x=c.getContext("2d");c.width=512;c.height=64;x.font=`${size||28}px "Chivo Mono", monospace`;x.fillStyle=col;x.fillText(text,4,44);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));s.scale.set(6,.75,1);s.position.set(RAD*1.25+3,y,0);scene.add(s);return s;}
for(let l=0;l<NL;l+=5)label("layer "+l,l*FLOOR-YC,"#56625b");
label("layer 35",(NL-1)*FLOOR-YC,"#56625b");
label("← chamber pushes here",(L+.5)*FLOOR-YC,"#e8ff6a",26);
label("↑ answer: 1 ends it · 0 goes on",(NL)*FLOOR-YC,"#d9dfd8",24);
const selMark=new THREE.Mesh(new THREE.RingGeometry(.28,.36,32),new THREE.MeshBasicMaterial({color:0xe8ff6a,side:THREE.DoubleSide,transparent:true,opacity:.95,depthTest:false}));selMark.rotation.x=-Math.PI/2;selMark.visible=false;scene.add(selMark);

// camera: drag to orbit, wheel / pinch to zoom
let th=.7, ph=1.18, dist=58, tgtY=0; const ptrs=new Map(); let pinch0=0, moved=0;
function placeCam(){cam.position.set(dist*Math.sin(ph)*Math.cos(th),tgtY+dist*Math.cos(ph),dist*Math.sin(ph)*Math.sin(th));cam.lookAt(0,tgtY,0);}
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a[0]-b[0],a[1]-b[1]);}});
cv.addEventListener("pointermove",e=>{
 if(!ptrs.has(e.pointerId)){hover(e);return;}
 const p=ptrs.get(e.pointerId),dx=e.clientX-p[0],dy=e.clientY-p[1];moved+=Math.abs(dx)+Math.abs(dy);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptrs.size===1){th+=dx*.006;ph=Math.min(2.9,Math.max(.15,ph-dy*.006));}
 else{const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);dist=Math.min(140,Math.max(8,dist*pinch0/d));pinch0=d;}
 placeCam();});
cv.addEventListener("pointerup",e=>{ptrs.delete(e.pointerId);if(moved<6)pick(e);});
cv.addEventListener("wheel",e=>{e.preventDefault();if(e.shiftKey){tgtY=Math.max(-YC,Math.min(YC,tgtY-e.deltaY*.03));}else dist=Math.min(140,Math.max(8,dist*(1+e.deltaY*.0012)));placeCam();},{passive:false});
function resize(){const r=cv.parentElement.getBoundingClientRect();R.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix();}
addEventListener("resize",resize);

/* ---------- picking: nearest lit featured neuron to the pointer, in screen space ---------- */
const v3=new THREE.Vector3();
function nearest(e){const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,bd=18*18;
 for(const x of F.neurons){const i=x.l*NI+x.n;if(Math.abs(val[i])<.04)continue;v3.set(pos[i*3],pos[i*3+1],pos[i*3+2]).project(cam);
  const sx=(v3.x+1)/2*r.width,sy=(1-v3.y)/2*r.height,d=(sx-mx)**2+(sy-my)**2;if(d<bd&&v3.z<1){bd=d;best=x;}}
 return best;}
const tip=$("#tip");
function hover(e){const x=nearest(e);if(!x){tip.style.display="none";return;}const r=cv.getBoundingClientRect();
 tip.innerHTML=`<b>L${x.l} · N${x.n}</b> ${valueText(x)}<br><span style="color:var(--pos)">${(x.lens?.[0]||[]).slice(0,4).map(vis).join(" ")}</span>`;
 tip.style.display="block";tip.style.left=Math.min(r.width-290,e.clientX-r.left+14)+"px";tip.style.top=(e.clientY-r.top+14)+"px";}
function pick(e){const x=nearest(e);if(x){S.sel=x;draw();renderSide();}}

/* ---------- values per view ---------- */
const fi=f=>FE.indexOf(f);
function weightVal(i,f){return grid[i*REC+2+fi(f)]/127;}
function movedVal(x,f,t){const m=x.moved?.[f];if(!m)return null;return m.d[t];}
function attrVal(x,c,t){const a=x.attr?.[c];if(!a)return null;return t==null?a.v:a.t[t];}
let norm=1;
function valueText(x){
 if(S.view==="weights"){const c=grid[(x.l*NI+x.n)*REC+2+fi(S.feel)]/127*M.cos_scale;return `${x.l<=L?"writes":"reads"} ${S.feel} · cos ${c>=0?"+":""}${c.toFixed(3)}`;}
 if(S.view==="moved"){const d=movedVal(x,S.feel,S.tok);return d==null?"not among the most moved":`Δ ${d>=0?"+":""}${d.toFixed(2)} at “${vis(M.tokens[S.tok])}”`;}
 const a=attrVal(x,S.cond,S.view==="attr"&&S.tok<T-1?S.tok:null);return a==null?"not among the top drivers":`pushes ${a>=0?"toward 1 (end)":"toward 0 (go on)"} ${Math.abs(a).toFixed(3)}`;}
function draw(){
 val.fill(0);
 if(S.view==="weights"){const k=2+fi(S.feel);for(let i=0;i<N;i++)val[i]=grid[i*REC+k]/127;let mx=0;for(let i=0;i<N;i++)mx=Math.max(mx,Math.abs(val[i]));for(let i=0;i<N;i++){const a=val[i]/mx;val[i]=Math.sign(a)*Math.pow(Math.abs(a),1.6);}}
 else if(S.view==="moved"){let mx=0;const vs=[];for(const x of F.neurons){let d=movedVal(x,S.feel,S.tok);if(d==null)continue;if(S.minus){const e=movedVal(x,"egg",S.tok)||0;d-=e;}vs.push([x.l*NI+x.n,d]);mx=Math.max(mx,Math.abs(d));}
  for(const [i,d] of vs)val[i]=Math.sign(d)*Math.pow(Math.abs(d)/(mx||1),.6);}
 else{let mx=0;const vs=[];const t=S.tok<T-1?S.tok:null;for(const x of F.neurons){let a=attrVal(x,S.cond,t);if(a==null)continue;if(S.minus&&S.cond!=="none"){a-=attrVal(x,"none",t)||0;}vs.push([x.l*NI+x.n,a]);mx=Math.max(mx,Math.abs(a));}
  for(const [i,a] of vs)val[i]=Math.sign(a)*Math.pow(Math.abs(a)/(mx||1),.6);}
 aVal.needsUpdate=true;
 if(S.sel){const i=S.sel.l*NI+S.sel.n;selMark.position.set(pos[i*3],pos[i*3+1]+.01,pos[i*3+2]);selMark.visible=true;}else selMark.visible=false;
 legend();}
function legend(){
 const lg=$("#legend");
 const t={weights:[["var(--pos)","positive pole lines up with "+S.feel],["var(--neg)","negative pole lines up with "+S.feel],["var(--push)","floors 0–18 write · 19–35 read"]],
  moved:[["var(--pos)","fires more under "+S.feel+(S.minus?" than under the egg":"")],["var(--neg)","fires less (or more negative)"]],
  attr:[["var(--pos)","pushes the answer toward 1 (end it)"],["var(--neg)","pushes toward 0 (go on)"]]}[S.view];
 lg.innerHTML=t.map(([c,s])=>`<div><i style="background:${c}"></i>${esc(s)}</div>`).join("");}

/* ---------- controls ---------- */
function buttons(el,items,cur,on){el.innerHTML=items.map(([k,lab])=>`<button type="button" data-k="${k}" aria-pressed="${k===cur}">${esc(lab)}</button>`).join("");
 el.onclick=e=>{const b=e.target.closest("button");if(!b)return;on(b.dataset.k);};}
function controls(){
 document.querySelectorAll("#views button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.view));
 if(S.view==="weights")buttons($("#feels"),FE.map(f=>[f,f]),S.feel,k=>{S.feel=k;refresh();});
 else if(S.view==="moved")buttons($("#feels"),FEEL_RUN.map(f=>[f,f]),S.feel,k=>{S.feel=k;refresh();});
 else buttons($("#feels"),[["none","no push"],...FEEL_RUN.map(f=>[f,f])],S.cond,k=>{S.cond=k;refresh();});
 const minusLab=S.view==="moved"?"minus egg":"minus no-push";
 buttons($("#opts"),S.view==="weights"?[]:[["minus",(S.minus?"✓ ":"")+minusLab]],S.minus?"minus":"",()=>{S.minus=!S.minus;refresh();});
 $("#tokens").style.display=S.view==="weights"?"none":"flex";}
$("#views").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.view=b.dataset.v;if(S.view!=="weights"&&!FEEL_RUN.includes(S.feel))S.feel="pain";refresh();};
function tokrow(){
 const row=$("#tokrow");row.innerHTML=M.tokens.map((t,i)=>`<button type="button" data-i="${i}" class="${i===S.tok?"on":""}">${vis(t)||"∅"}</button>`).join("");
 row.onclick=e=>{const b=e.target.closest("button");if(!b)return;S.tok=+b.dataset.i;refresh();};
 const t=M.tokens[S.tok];$("#tokinfo").textContent=S.view==="attr"?(S.tok===T-1?"answer position · summed over all tokens":`attribution at “${t.replace(/\n/g,"⏎")}” only`):`token ${S.tok+1}/${T}: “${t.replace(/\n/g,"⏎")}”`;
 row.querySelector(".on")?.scrollIntoView({block:"nearest",inline:"center"});}
let playing=null;
$("#play").onclick=()=>{
 if(playing){cancelAnimationFrame(playing);playing=null;$("#play").textContent="▶ play";uni.uFloorHi.value=99;uni.uFloorLo.value=-99;return;}
 $("#play").textContent="■ stop";const t0=performance.now(),up=S.view!=="attr";
 (function step(now){const k=Math.min(1,(now-t0)/4200),fl=up?(L+.5+k*(NL-L))*FLOOR-YC:((NL-1)-k*NL)*FLOOR-YC;
  if(up){uni.uFloorHi.value=Math.max((L+.5)*FLOOR-YC,fl);uni.uFloorLo.value=-99;}else{uni.uFloorLo.value=fl;uni.uFloorHi.value=99;}
  th+=.0025;placeCam();if(k<1)playing=requestAnimationFrame(step);else{playing=null;$("#play").textContent="▶ play";uni.uFloorHi.value=99;uni.uFloorLo.value=-99;}})(t0);};

/* ---------- side panel ---------- */
function bar(v,mx,col){const w=Math.min(50,Math.abs(v)/mx*50);return `<div class="b"><i style="left:${v>=0?50:50-w}%;width:${w}%;background:${col}"></i></div>`;}
function overview(){
 const c=M.concentration,rw=c.writers.random.top50,rr=c.readers.random.top50;
 const pd=M.press_delta;
 let h=`<div><h2>${S.view==="weights"?"Where a feeling lives in the weights":S.view==="moved"?"What the push actually moves":"What decides the answer"}</h2></div>`;
 h+=`<p>${S.view==="weights"?"Every dot is one MLP neuron of Qwen3-4B: 36 floors of 9,728. The chamber adds a feeling at the yellow plane. Below it, a dot is lit when what the neuron writes points along the feeling; above it, when what the neuron listens for does. Orange is the positive pole, blue the negative.":S.view==="moved"?"The same scene run twice, with and without the push at dose 4. Lit dots are the 30 neurons per floor that changed most at the chosen token. Turn on “minus egg” to keep only what is specific to the feeling, not to being pushed at all.":"Bottom-up: start from the answer and ask each neuron how much it pushed toward 1 (end it) or 0 (go on). Activation times gradient of the 1-vs-0 logit gap. Lit dots are the top 20 per floor."}</p>`;
 if(S.view==="weights"){
  h+=`<div><h3>How concentrated is each feeling? share held by the top 50</h3><div class="bars">`;
  const mx=Math.max(...FE.map(f=>Math.max(c.writers[f].top50,c.readers[f].top50)));
  for(const f of FE)h+=`<span>${esc(f)}</span>${bar(c.writers[f].top50,mx,"var(--pos)")}<span>${(c.writers[f].top50*100).toFixed(2)}%</span>`;
  h+=`<span style="color:var(--dim)">random</span>${bar(rw,mx,"var(--faint)")}<span>${(rw*100).toFixed(2)}%</span></div>`;
  h+=`<p class="note">Writers, floors 0–18: the top 50 of 184,832 neurons hold under 1.4% of any feeling's projection, 1.2–2.8× a random direction. By the weights, every feeling is spread thin. Faith and curiosity are the most concentrated; the egg control is at chance.</p></div>`;}
 else{
  const conds=["none",...FEEL_RUN];
  const mx=Math.max(...conds.map(k=>Math.abs(pd[k]??M.attr_diff[k])));
  h+=`<div><h3>The answer under each push · log P(1) − log P(0)</h3><div class="bars">`;
  for(const k of conds){const v=pd[k];h+=`<span>${k==="none"?"no push":k}</span>${bar(v,mx,v>=0?"var(--pos)":"var(--neg)")}<span>${v>=0?"+":""}${v.toFixed(2)}</span>`;}
  h+=`</div><p class="note">With nothing pushed the model keeps going (0) by a wide margin. Any push at dose 4 flips it to ending it, the egg control included, so most of what moves is “something was pushed”, not the feeling. That is why the minus switch matters.</p></div>`;}
 h+=`<div class="note">Click a lit dot to read its neuron. Drag to turn, scroll to zoom, shift-scroll to move up and down.</div>`;
 return h;}
function neuronPanel(x){
 const c=x.l<=L?"writer":"reader";
 let h=`<div><h3>layer ${x.l} · neuron ${x.n}${x.l<=L?'<span class="pill">below the push</span>':'<span class="pill">above the push</span>'}</h3><h2>${guessTitle(x)}</h2></div>`;
 h+=`<div class="kv">`;
 for(const f of (S.view==="weights"?[S.feel]:[])){const v=grid[(x.l*NI+x.n)*REC+2+fi(f)]/127*M.cos_scale;h+=`<span>${x.l<=L?"writes":"reads"} ${esc(f)}</span><span>cos ${v>=0?"+":""}${v.toFixed(3)}</span>`;}
 if(x.moved?.[S.feel]&&S.view==="moved"){const m=x.moved[S.feel];h+=`<span>at its peak</span><span>${m.a0} → ${m.a1} on “${vis(M.tokens[m.peak])}”${m.leak?" · double-negative leak":""}</span>`;}
 if(x.attr){for(const k of ["none",...FEEL_RUN])if(x.attr[k])h+=`<span>drives answer, ${k==="none"?"no push":k}</span><span>${x.attr[k].v>=0?"→1 ":"→0 "}${Math.abs(x.attr[k].v).toFixed(3)}</span>`;}
 h+=`</div>`;
 if(x.lens){h+=`<div><h3>tokens it writes up (logit lens)</h3><div class="toks p">${x.lens[0].map(t=>`<code>${vis(t)}</code>`).join("")}</div></div>`;
  h+=`<div><h3>tokens it writes down</h3><div class="toks n">${x.lens[1].map(t=>`<code>${vis(t)}</code>`).join("")}</div></div>`;}
 if(x.ex){h+=`<div><h3>strongest firings in ${(M.corpus.n_tokens||0).toLocaleString()} tokens of web text · positive pole (max ${x.ex.max})</h3>`+x.ex.pos.map(p=>`<div class="ex"><em>…</em>${esc(p[0])}<b>${esc(p[1])}</b>${esc(p[2])} <em>${p[3]}${p[4]?" · leak":""}</em></div>`).join("")+`</div>`;
  h+=`<div><h3>negative pole (min ${x.ex.min})</h3>`+x.ex.neg.map(p=>`<div class="ex n"><em>…</em>${esc(p[0])}<b>${esc(p[1])}</b>${esc(p[2])} <em>${p[3]}</em></div>`).join("")+`</div>`;}
 else h+=`<p class="note">Corpus examples for this neuron aren't in this build yet.</p>`;
 if(S.view!=="weights"){const series=S.view==="moved"?x.moved?.[S.feel]?.d:x.attr?.[S.cond]?.t;
  if(series){const mx=Math.max(...series.map(Math.abs))||1;h+=`<div><h3>${S.view==="moved"?"change at each token":"push on the answer from each token"}</h3><svg viewBox="0 0 ${T*6} 60" width="100%" height="60" role="img" aria-label="per-token values">`+
   `<line x1="0" x2="${T*6}" y1="30" y2="30" stroke="var(--line)"/>`+series.map((v,i)=>`<rect x="${i*6+1}" width="4" y="${v>=0?30-v/mx*28:30}" height="${Math.abs(v)/mx*28}" fill="${v>=0?"var(--pos)":"var(--neg)"}" opacity="${i===S.tok?1:.65}"/>`).join("")+`</svg></div>`;}}
 h+=`<button type="button" id="back" style="font:inherit;font-size:11px;background:none;border:1px solid var(--line);color:var(--dim);padding:4px 10px;cursor:pointer;align-self:start">← overview</button>`;
 return h;}
function guessTitle(x){const p=x.ex?.pos?.[0];return p?`fires on “${esc(p[1].trim()||p[1])}” in “…${esc(p[0].slice(-36))}”`:`writes ${x.lens?x.lens[0].slice(0,3).map(vis).join(" "):"?"}`;}
function renderSide(){const s=$("#side");s.innerHTML=S.sel?neuronPanel(S.sel):overview();const b=$("#back");if(b)b.onclick=()=>{S.sel=null;draw();renderSide();};}
function refresh(){controls();tokrow();draw();renderSide();}

$("#loading").remove(); resize(); placeCam(); refresh();
(function loop(){R.render(scene,cam);if(!playing&&!ptrs.size&&!matchMedia("(prefers-reduced-motion: reduce)").matches){th+=.0006;placeCam();}requestAnimationFrame(loop);})();
})();
</script>

<title>Neuron Tower</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* Layout: one dark instrument. The tower fills the stage, the transcript runs along its foot, a reading panel sits on
   the right (below on phones). Colour carries meaning: what a neuron is about, from its blind label. */
:root{
  --bg:#07090b; --panel:#0d1013; --line:#1f262b; --fg:#d9dfd8; --dim:#7b8780; --faint:#3a4540;
  --pos:#ff7a3d; --neg:#3ec6ff; --push:#e8ff6a;
  --c0:#ff5a4e; --c1:#ff8fc8; --c2:#b48cff; --c3:#ffd166; --c4:#4fe0c4; --c5:#6f93c9; --c6:#8aa29a;
  --c7:#55605a; --c8:#4a524e; --c9:#5b6a63; --c10:#4d5852; --c11:#56615b; --c12:#3e4743;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --serif:"Cormorant Garamond",Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--mono);margin:0;overflow:hidden}
#app{display:grid;grid-template-columns:minmax(0,1fr) 370px;height:100%}
#stage{position:relative;min-width:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
canvas.over{cursor:pointer}
#bar select{font:inherit;font-size:11px;background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:2px 4px}
#tags div:hover{background:var(--panel)}
#hud{position:absolute;left:16px;top:12px;right:16px;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:2}
#hud .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#hud .row>*{pointer-events:auto}
#moretog{font:inherit;font-size:12px;background:var(--panel,#0b0f12);color:var(--dim);border:1px solid var(--line);padding:4px 10px;cursor:pointer}
#moretog[aria-expanded="true"]{color:var(--fg)}
#hud .more[hidden]{display:none}
h1{font:600 20px/1.1 var(--serif);margin:0 10px 0 0}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent)}
.seg button{font:inherit;font-size:11px;background:none;color:var(--dim);border:0;padding:5px 8px;cursor:pointer;letter-spacing:.03em}
.seg button[aria-pressed=true]{color:var(--bg);background:var(--fg)}
.seg.acc button[aria-pressed=true]{background:var(--push)}
.seg .lab{font-size:10px;color:var(--faint);padding:5px 6px 5px 8px;letter-spacing:.12em;text-transform:uppercase}
button:focus-visible{outline:1px solid var(--push);outline-offset:1px}
#tags{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#tags div{pointer-events:auto;cursor:pointer;position:absolute;font-size:10.5px;white-space:nowrap;padding:1px 5px;background:color-mix(in srgb,var(--bg) 70%,transparent);border-left:2px solid currentColor;transform:translate(10px,-50%);max-width:260px;overflow:hidden;text-overflow:ellipsis}
#foot{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 12px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;flex-direction:column;gap:6px;z-index:2}
#bar{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--dim);flex-wrap:wrap}
#bar button{font:inherit;font-size:11px;background:none;border:1px solid var(--line);color:var(--fg);padding:3px 10px;cursor:pointer}
#textwrap{position:relative}
#arcs{position:absolute;inset:0;pointer-events:none;overflow:hidden;filter:drop-shadow(0 0 3px rgba(255,140,90,.55)) drop-shadow(0 0 6px rgba(80,200,255,.35))}
#arcs path.flow{stroke-dasharray:3 9;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){#arcs path.flow{animation:none}}
#text span.lk{background:color-mix(in srgb,var(--pos) 22%,transparent)}
#text span.lkn{background:color-mix(in srgb,var(--neg) 22%,transparent)}
#text{max-height:120px;overflow-y:auto;font-size:12px;line-height:2.25;scrollbar-width:thin}
#text span{cursor:pointer;white-space:pre-wrap;border-radius:2px}
#text span.p{color:var(--faint)} #text span.r{color:var(--fg)}
#text span.on{background:var(--push);color:var(--bg)}
#text span.fut{opacity:.25}
#text span.hid{display:none}
#text span.r0::before{content:"\A";white-space:pre}
#text span.src{box-shadow:inset 0 -2px 0 var(--push)}
#text span.own{outline:1px dashed var(--fg);outline-offset:1px}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);padding:6px 8px;font-size:11px;max-width:300px;display:none;z-index:3}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
aside h2{font:600 17px/1.25 var(--serif);margin:0;text-wrap:balance}
aside h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 6px;font-weight:400}
aside p{margin:0;font-family:var(--serif);font-size:14.5px;line-height:1.5}
.note{font-size:11px;color:var(--dim);line-height:1.5}
.big{font:600 28px/1.1 var(--serif);word-break:break-word}
.list{display:flex;flex-direction:column;gap:4px}
.list button{all:unset;cursor:pointer;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:11.5px;padding:2px 0}
.list button:hover .t,.list button:focus-visible .t{text-decoration:underline}
.list i{width:8px;height:8px;border-radius:50%;display:inline-block}
.list .t{overflow-wrap:anywhere}
.list .m{color:var(--dim);font-variant-numeric:tabular-nums;font-size:10.5px}
.cats{display:grid;grid-template-columns:minmax(0,1fr) 1fr 34px;gap:3px 8px;font-size:11px;align-items:center;font-variant-numeric:tabular-nums}
.cats .b{height:7px;background:var(--line)} .cats .b i{display:block;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:11.5px;font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--dim)}
.toks{display:flex;flex-wrap:wrap;gap:3px} .toks code{font:inherit;font-size:11px;padding:1px 5px;border:1px solid var(--line);white-space:pre}
.ex{font-size:11.5px;line-height:1.5;color:var(--dim);border-left:2px solid var(--line);padding-left:8px;margin:4px 0;overflow-wrap:anywhere}
.ex b{color:var(--bg);background:var(--pos);font-weight:400;padding:0 2px} .ex.n b{background:var(--neg)} .ex em{font-style:normal;color:var(--faint)}
.chip{display:inline-block;font-size:10px;padding:1px 6px;border:1px solid currentColor;letter-spacing:.04em}
.circ svg{display:block;width:100%;height:auto;overflow:visible}
.circ .gb{cursor:pointer}.circ .gb:hover rect,.circ .gb.on rect{stroke:var(--push)}
.cw{font:inherit;font-size:11px;background:none;border:1px solid var(--push);color:var(--push);padding:2px 8px;cursor:pointer}
.cw[aria-pressed=true]{background:var(--push);color:var(--bg)}
#mine{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#mine input{font:inherit;font-size:12px;background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:5px 8px;width:min(46ch,60vw)}
#mine select,#mine button{font:inherit;font-size:11px;background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:5px 8px;cursor:pointer}
#mine button{border-color:var(--push);color:var(--push)}
.lab-btns{display:flex;gap:6px;flex-wrap:wrap}
.lab-btns button,.edits button{font:inherit;font-size:11px;background:none;border:1px solid var(--line);color:var(--fg);padding:4px 9px;cursor:pointer}
.lab-btns button.go,.edits button.go{border-color:var(--push);color:var(--push)}
.lab-btns button[disabled]{opacity:.4;cursor:not-allowed}
.edits{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11px}
.edits .chip{display:inline-flex;gap:6px;align-items:center;padding:2px 6px}
.cmp{font-size:12px;line-height:1.5;border-left:2px solid var(--line);padding-left:8px;color:var(--dim)}
.cmp.new{border-color:var(--push);color:var(--fg)}
#floorpick{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--dim);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);padding:4px 8px}
#floorpick input{width:min(320px,40vw);accent-color:var(--push)}
.dmap circle{cursor:pointer}.dmap text{pointer-events:none}
#designer{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;padding:8px 10px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);font-size:11px;max-width:min(760px,100%)}
#designer .full{grid-column:1/-1}
#designer label{display:flex;flex-direction:column;gap:2px;color:var(--dim)}
#designer input[type=range]{accent-color:var(--push)}
#designer textarea{font:inherit;font-size:11.5px;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:6px;min-height:72px;resize:vertical}
#designer .modes{display:flex;gap:6px}#designer .modes button{font:inherit;font-size:11px;background:none;border:1px solid var(--line);color:var(--dim);padding:3px 8px;cursor:pointer}
#designer .modes button[aria-pressed=true]{color:var(--bg);background:var(--push);border-color:var(--push)}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:12px}
@media (max-width:820px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;grid-template-rows:78vh auto;height:auto}
  aside{border-left:0;border-top:1px solid var(--line)}
}
.pz-ex{font-size:12px;line-height:1.5;color:var(--dim);margin:2px 0}.pz-ex b{color:var(--bg);background:var(--push);padding:0 2px;border-radius:2px}
.pz-t{display:grid;grid-template-columns:1fr 64px;gap:2px 10px;align-items:center;margin:3px 0;font-size:12px}
.pz-t .tx{color:var(--dim)}.pz-t .tx b{color:var(--fg);border-bottom:2px solid var(--pos)}
.pz-t .bar{position:relative;height:8px;background:var(--line)}.pz-t .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--pos)}
.pz-t .bar u{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--fg);opacity:.6}
.pz-t .v{font-size:10px;color:var(--faint);grid-column:2;text-align:right;margin-top:-2px}
.pz-reveal{border-left:2px solid var(--push);padding:4px 0 4px 10px;margin:8px 0}
#hgrid{display:grid;grid-template-columns:repeat(32,1fr);gap:1px;margin:6px 0 4px}
#hgrid i{aspect-ratio:1;display:block;cursor:pointer;opacity:.28}
#hgrid i.on{opacity:1;box-shadow:0 0 0 1px #fff}
#hgrid i.cut{opacity:.9;box-shadow:inset 0 0 0 2px #0b0e0d,0 0 0 1px var(--pos)}
.hk{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:11px}
.hk span{display:inline-flex;gap:5px;align-items:center}.hk i{width:9px;height:9px;display:inline-block;border-radius:2px}
.hk button{all:unset;cursor:pointer;color:var(--dim);text-decoration:underline dotted}.hk button[aria-pressed="true"]{color:var(--pos)}
.abar{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;font-size:11px;align-items:center}.abar .b{height:6px;background:var(--line)}.abar .b i{display:block;height:100%}
#text span.att{border-bottom:2px solid var(--att);background:color-mix(in srgb,var(--att) 18%,transparent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="3D tower of a language model's MLP neurons, one floor per layer"></canvas>
    <div id="tags"></div>
    <div id="loading">loading the neurons…</div>
    <div id="hud">
      <div class="row"><h1>Neuron Tower</h1>
        <div class="seg" id="model" role="group" aria-label="Model"></div>
        <div class="seg" id="views" role="group" aria-label="View"></div>
        <div class="seg" id="filter" role="group" aria-label="Meaning filter"></div>
      </div>
      <div class="row" id="row2"></div>
    </div>
    <div id="tip"></div>
    <div id="foot">
      <div id="bar"></div>
      <div id="textwrap"><div id="text" aria-live="off"></div><svg id="arcs" aria-hidden="true"></svg></div>
    </div>
  </div>
  <aside id="side"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
const $=s=>document.querySelector(s), esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const tokName=t=>TOKNAME[t]||t;
function tmplHidden(toks){   // the chat template's own tokens: turn markers, role names, the empty think block
 const h=new Set(),ws=t=>/^\s*$/.test(t||"");

 return h;}

const S={floor:27,dk:null,view:"live",prompt:"describe",cond:"fear",mode:"fires",feel:"fear",wfeel:"fear",filter:new URLSearchParams(location.search).get("model")==="32b"?"all":"meaning",tok:0,sel:null,playing:false,grp:null,edits:new Map(),dedits:new Map(),more:(()=>{try{return localStorage.getItem("tower.more")==="1";}catch(e){return false;}})(),pz:0,pzReveal:false,hedits:new Set(),kedits:new Set(),attn:"kinds",design:{open:false,mode:"preset",mix:{},own:"",dose:4,sx:"France",sy:"Japan",sfloor:8,salpha:1}};   // dedits: "floor:district" -> null | x   // edits: neuron k -> null (removed) | x (held at x times its range)

for(let i=0;i<N;i++){const o=i*REC,l=(i/NI)|0;pos[i*3]=grid[o]/127*RAD;pos[i*3+1]=l*FLOOR-YC;pos[i*3+2]=grid[o+1]/127*RAD;}

let PZ=null;if(MD==="4b")fetch(DD+"puzzles.json").then(r=>r.ok?r.json():null).then(j=>{PZ=j;if(j)controls();}).catch(()=>{});
try{const [dp,dj]=await Promise.all([fetch(DD+"districts.png").then(r=>r.ok?r.blob():null),fetch(DD+"districts.json").then(r=>r.ok?r.json():null)]);
 if(dp&&dj){const im=await createImageBitmap(dp,{colorSpaceConversion:"none",premultiplyAlpha:"none"}),c=document.createElement("canvas");c.width=im.width;c.height=im.height;
  const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0);const d=x.getImageData(0,0,im.width,im.height).data;dId=new Uint8Array(N);for(let i=0;i<N;i++)dId[i]=d[i*4];DIST=dj;
  const per=NI/DIST.k;

   const P=F_.map(d=>({x:d.xy[0],y:d.xy[1],r:.17*Math.sqrt(Math.max(1,d.n)/per)}));
   for(let it=0;it<240;it++){for(let a=0;a<P.length;a++)for(let b=a+1;b<P.length;b++){const A=P[a],B=P[b];let dx=B.x-A.x,dy=B.y-A.y,dd=Math.hypot(dx,dy)||1e-3;const m=A.r+B.r+.04;

   const sc=1/Math.max(...P.map(q=>Math.hypot(q.x,q.y)+q.r));F_.forEach((d,k)=>{d.c=[P[k].x*sc,P[k].y*sc];d.rr=P[k].r*sc;});}

 const row=S.view==="live"?(cond().wl||[]).find(r=>r[0]===t):null;if(!row){sv.innerHTML="";return;}
 const W=tx.clientWidth,H=tx.clientHeight,me=tx.children[t];if(!me){sv.innerHTML="";return;}
 const at=sp=>[sp.offsetLeft+sp.offsetWidth/2,sp.offsetTop-tx.scrollTop+3];const[x1,y1]=at(me);let h="";
 row[1].forEach((p,j)=>{const v=row[2][j],sp=tx.children[p];if(!sp||p===t||Math.abs(v)<8)return;const[x0,y0]=at(sp);
  sp.classList.add(v>0?"lk":"lkn");const lift=Math.min(34,14+Math.abs(x1-x0)*.08+Math.abs(y1-y0)*.4),cy=Math.min(y0,y1)-lift;
  const dpath=`M${x0.toFixed(1)},${y0.toFixed(1)} Q${((x0+x1)/2).toFixed(1)},${cy.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  h+=`<path d="${dpath}" fill="none" stroke="${v>0?"#ff7a3d":"#3ec6ff"}" stroke-width="${(.8+2.6*Math.abs(v)/100).toFixed(2)}" stroke-opacity="${(.3+.5*Math.abs(v)/100).toFixed(2)}"/><path class="flow" d="${dpath}" fill="none" stroke="#fff" stroke-width="${(.6+1.4*Math.abs(v)/100).toFixed(2)}" stroke-opacity="${(.25+.6*Math.abs(v)/100).toFixed(2)}"/><circle cx="${x0.toFixed(1)}" cy="${y0.toFixed(1)}" r="2" fill="${v>0?"#ff7a3d":"#3ec6ff"}"/>`;});
 sv.setAttribute("viewBox",`0 0 ${W} ${H}`);sv.innerHTML=h;}
function markAttn(){const tx=$("#text");if(!tx)return;for(const sp of tx.querySelectorAll(".att")){sp.classList.remove("att");sp.style.removeProperty("--att");}
 const a=attnNow();if(!a)return;for(const[k,v]of attnSources(a,S.tok).slice(0,5)){const sp=tx.children[k];if(!sp)continue;const kk=Object.entries(v.k).sort((x,y)=>y[1]-x[1])[0][0];sp.classList.add("att");sp.style.setProperty("--att",S.attn==="kinds"?HCOL[kk]:"#e9efe6");}}
function cursor(){   // cheap per-token update during playback: move the highlight, dim what hasn't been read yet, keep it in view
 const tx=$("#text"),toks=toksNow(),np=npNow();markAttn();tx.querySelector(".on")?.classList.remove("on");
 const cur=tx.children[S.tok];if(cur){cur.classList.add("on");const box=tx.getBoundingClientRect(),c=cur.getBoundingClientRect();if(c.top<box.top||c.bottom>box.bottom)tx.scrollTop+=c.top-box.top-box.height/2;}
 for(let i=0;i<tx.children.length;i++)tx.children[i].classList.toggle("fut",S.playing&&i>S.tok);
 drawArcs(S.tok);
 const info=$("#tokinfo");if(info)info.textContent=(S.view==="live"?(S.mode==="chose"?(S.tok>=np?`chose “${toks[S.tok]?.replace(/\n/g,"⏎")}”`:"pick a reply word"):`${S.tok<np?"reading":"writing"} “${(toks[S.tok]||"").replace(/\n/g,"⏎")}”`):`at “${toks[S.tok]}”`)+` · token ${S.tok+1}/${toks.length}`;}

 if(S.view==="puzzles"){const p=PZ?.puzzles[S.pz];bar.innerHTML=p?`<span>Puzzle ${S.pz+1} of ${PZ.puzzles.length} · floor ${p.l}, neuron ${p.n} · ${esc(p.source)}. Each neuron's strongest firings come from ${M.corpus_tokens.toLocaleString()} tokens of web text; the test texts were run on the model for this page.</span>`:"";tx.innerHTML="";txKey="";const sv=$("#arcs");if(sv)sv.innerHTML="";return;}
 if(S.view==="districts"){bar.innerHTML=`<span>Each floor's ${NI.toLocaleString()} neurons, clustered into ${DIST.k} districts by what they write into the model. Drag the floor slider; click a district name to light it.</span>`;tx.innerHTML="";txKey="";return;}

 bar.innerHTML=`<button type="button" id="play">${S.playing?"■ stop":"▶ play"}</button><select id="speed" aria-label="Playback speed"><option value=".5">½×</option><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select><span id="tokinfo"></span>`;
 $("#play").onclick=()=>S.playing?stop():play();$("#speed").value=String(speed);$("#speed").onchange=e=>{speed=+e.target.value;};

  sp.onclick=e=>{const b=e.target.closest("button[data-t]");if(!b)return;stop();S.mode="chose";S.tok=+b.dataset.t;S.grp=null;S.sel=null;refresh();};}}

 const hid=tmplHidden(toks);let first=true;
 for(let i=0;i<tx.children.length;i++){let c=(i<np?"p":"r");if(hid.has(i))c+=" hid";else if(i>=np&&first){c+=" r0";first=false;}tx.children[i].className=c;}
 tx.onmouseover=e=>{const s=e.target.closest("span[data-i]");if(s&&!S.playing)drawArcs(+s.dataset.i);};
 tx.onmouseleave=()=>{if(!S.playing)drawArcs(S.tok);};tx.onscroll=()=>drawArcs(S.tok);
 tx.onclick=e=>{const s=e.target.closest("span[data-i]");if(!s)return;stop();S.tok=+s.dataset.i;S.grp=null;if(S.mode==="chose")ensureChose(S.tok);refresh();};
 cursor();}
let timer=null;
function stop(){if(!S.playing)return;S.playing=false;clearTimeout(timer);const b=$("#play");if(b)b.textContent="▶ play";cursor();}
function play(){S.playing=true;const b=$("#play");if(b)b.textContent="■ stop";
 const toks=toksNow(),np=S.view==="live"?ST.prompts[S.prompt].n_prompt:1e9,chose=S.view==="live"&&S.mode==="chose";
 const has=t=>!chose||cond().ch.some(x=>x[0]===t)||(cond().circ||[]).some(x=>x.t===t);
 const hid=tmplHidden(toks),order=[...toks.keys()].filter(t=>has(t)&&!hid.has(t));if(!order.length){stop();return;}
 let j=order.indexOf(S.tok);if(j<0||j>=order.length-1)j=0;
 const step=()=>{if(!S.playing)return;S.tok=order[j];draw();cursor();side();
  if(++j>=order.length){timer=setTimeout(stop,600);return;}timer=setTimeout(step,(S.tok<np?140:520)/speed);};step();}

function catBars(idx){const cnt=new Array(CATS.length).fill(0);let un=0;for(const i of idx){const x=byK.get(i);if(x?.cat!=null)cnt[x.cat]++;else un++;}
 const tot=cnt.reduce((a,b)=>a+b,0),mx=Math.max(...cnt,1);
 return `<div class="cats">`+cnt.map((c,j)=>c?`<span style="color:${CC[j]}">${CATSHORT[j]}</span><div class="b"><i style="width:${c/mx*100}%;background:${CC[j]}"></i></div><span>${c}</span>`:"").join("")+`</div><p class="note">${tot} labelled${un?`, ${un} not yet labelled`:""}.</p>`;}
function nlist(items){return `<div class="list">`+items.map(([i,v])=>{const x=byK.get(i),l=(i/NI)|0;return `<button type="button" data-k="${i}"><i style="background:${x?.cat!=null?CC[x.cat]:"var(--faint)"}"></i><span class="t">${x?.lab?esc(x.lab):"(not labelled)"}</span><span class="m">L${l}${v==null?"":" "+(v>=0?"+":"−")+Math.abs(v).toFixed(2)}</span></button>`;}).join("")+`</div>`;}

 s.querySelectorAll("[data-unkedit]").forEach(b=>b.onclick=()=>{S.kedits.delete(b.dataset.unkedit);side();});
 s.querySelectorAll("#hgrid i").forEach(b=>b.onclick=()=>{const x=b.dataset.h;S.hedits.has(x)?S.hedits.delete(x):S.hedits.add(x);side();});
 s.querySelectorAll("[data-kcut]").forEach(b=>b.onclick=()=>{const k=b.dataset.kcut;S.kedits.has(k)?S.kedits.delete(k):S.kedits.add(k);side();});
 s.querySelectorAll("[data-unedit]").forEach(b=>b.onclick=()=>{S.edits.delete(+b.dataset.unedit);side();});
 s.querySelectorAll("[data-undedit]").forEach(b=>b.onclick=()=>{S.dedits.delete(b.dataset.undedit);side();});
 const rr=s.querySelector("#rerun");if(rr)rr.onclick=()=>{if(!liveOK)return needLive(rr.parentElement);rerun();};
 const ce=s.querySelector("#clearedits");if(ce)ce.onclick=()=>{S.edits.clear();S.dedits.clear();S.hedits.clear();S.kedits.clear();if(ST.prompts.__mine)ST.prompts.__mine.compare=null;side();};
 s.querySelectorAll("[data-dedit]").forEach(b=>b.onclick=()=>{const key=`${S.floor}:${S.dk}`,v=b.dataset.dedit==="off"?null:b.dataset.dedit;if(S.dedits.has(key)&&S.dedits.get(key)===v)S.dedits.delete(key);else S.dedits.set(key,v);side();});
 s.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const k=S.sel.k,v=b.dataset.edit==="off"?null:b.dataset.edit;if(S.edits.has(k)&&S.edits.get(k)===v)S.edits.delete(k);else S.edits.set(k,v);side();});
 const lg=s.querySelector("#lesiongrp");if(lg)lg.onclick=()=>{if(!liveOK)return needLive(lg.parentElement);const ci=circ();const g=ci.groups[S.grp];for(const j of g.members)S.edits.set(ci.nodes[j][0],null);rerun();};}
function districtsPanel(){
 const F_=DIST.floors[S.floor],W=330,H=300,mxn=Math.max(...F_.map(d=>d.n));
 let sv=`<svg class="dmap" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="districts of floor ${S.floor}">`;
 const sc_=Math.min(W,H)*.46;for(const d of F_){if(!d.n)continue;const x=W/2+d.c[0]*sc_,y=H/2+d.c[1]*sc_,r=Math.max(5,d.rr*sc_),c=CC[CATD[d.cat]??12],on=S.dk===d.k;
  sv+=`<g data-dk="${d.k}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${c}" fill-opacity="${on?.55:.22}" stroke="${on?"#e8ff6a":c}" stroke-width="${on?2:1}"/><title>${esc(d.name)} · ${d.n} neurons</title><text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle" font-size="8" fill="#d9dfd8" font-family="IBM Plex Mono,monospace">${(()=>{const n_=Math.max(3,Math.floor(2*r/4.9));return esc(d.name.length>n_?d.name.slice(0,n_-1)+"…":d.name);})()}</text></g>`;}
 sv+=`</svg>`;
 const sem=F_.filter(d=>CATD[d.cat]<=6).length;
 let h=`<div><h2>Floor ${S.floor}: ${F_.filter(d=>d.n).length} districts</h2></div><p>Neurons in a district push the model's internal state the same way. Names come from 24 random members' strongest firings, read blind. ${sem} of ${F_.length} districts here are about meaning; the rest are about form (punctuation, word pieces, grammar).</p><div>${sv}</div>`;
 const d=S.dk!=null?F_[S.dk]:null;
 if(d){const mem=F.neurons.filter(x=>x.l===S.floor&&dId[x.k]===S.dk&&x.lab).slice(0,12);
  const dv=S.dedits.get(`${S.floor}:${S.dk}`);

  if(d.snips?.length)h+=`<div><h3>what its members fire on</h3>`+d.snips.map(t=>{const m=t.match(/^(.*)\[\[(.*)\]\]$/s);return `<div class="ex"><em>…</em>${esc(m?m[1]:t)}<b>${esc(m?m[2]:"")}</b></div>`;}).join("")+`</div>`;
  h+=`<div><h3>words its direction writes${S.floor<30?" (reliable mostly on the last floors)":""}</h3><div class="toks">${d.lens.map(t=>`<code>${vis(t)}</code>`).join("")}</div></div>`;
  if(mem.length)h+=`<div><h3>named members</h3>${nlist(mem.map(x=>[x.k,null]))}</div>`;}
 else h+=`<p class="note">Click a district (here or its name on the tower) to light it and read it.</p>`;

 const ex=x=>`<p class="pz-ex">…${vis(x.pre.slice(-90))}<b>${vis(x.tok)}</b>${vis(x.post.slice(0,40))}…</p>`;

  h+=`<details class="note"><summary style="cursor:pointer;color:var(--fg)">How much of this is about feelings?</summary><p class="note" style="margin-top:6px">${MD==="32b"?"On Qwen3-32B (same checks, without the blind-label test yet): removing a meaning-bearing group decides its word less often than on the 4B (2 of 13, against 7 of 10), as the bigger model has more backups; emotion words raise the share of feeling neurons among the most active (7.4% against 4.4% elsewhere); push-specific neurons are still mostly not feeling neurons (2–4%). The 4B numbers: ":""}Checked on Qwen3-4B: feeling labels pass blind tests about half the time (47% of texts written from the label fire the neuron, 14% of near misses). A push mostly moves neurons that aren't about feelings: 0–5% of the most push-specific neurons are feeling neurons, against 2.3% overall, and only pain and sadness clearly reach their own. Where feeling neurons do matter is at word choice: 7 of 10 meaning-bearing groups decide their word when removed, against 29% of grammar groups. Read the lights as emotional words and situations, not as a felt state. Larger models next.</p></details>`;

  h+=`<p class="note">By the weights alone every feeling is spread thin; the egg control sits near chance. Colours show what a neuron is about when it has a label; most of these have none, so “everything” shows them all.</p>`;}
 h+=`<p class="note">Drag to turn, scroll to zoom, shift-scroll to move up and down. Click a lit dot to read its neuron.</p>`;
 s.innerHTML=editsPanel()+h;wireEdits(s);markTokens();s.querySelectorAll(".gb").forEach(b=>{const go=()=>{const k=+b.dataset.g;S.grp=S.grp===k?null:k;draw();side();};b.onclick=go;b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};});s.querySelectorAll(".list button").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;S.sel=byK.get(k)||{k,l:(k/NI)|0,n:k%NI};draw();side();});}
function tokenTrace(ci,k){   // which words feed group k: summed |link| from source nodes by their token, plus where its own neurons sit
 const mem=new Set(ci.groups[k].members),src=new Map(),own=new Set();for(const j of mem)own.add(ci.nodes[j][1]);
 for(const[a,b,w]of ci.edges)if(mem.has(b)&&!mem.has(a)){const p=ci.nodes[a][1];src.set(p,(src.get(p)||0)+Math.abs(w));}
 return {src,own};}
function markTokens(){const tx=$("#text");if(!tx)return;for(const sp of tx.children){sp.classList.remove("src","own");sp.style.background="";}
 const ci=circ();if(!ci||S.grp==null)return;const {src,own}=tokenTrace(ci,S.grp),mx=Math.max(0,...src.values())||1;
 for(const[p,w]of src){const sp=tx.children[p];if(sp){sp.classList.add("src");sp.style.background=`rgba(232,255,106,${(.12+.5*w/mx).toFixed(2)})`;}}
 for(const p of own){const sp=tx.children[p];if(sp)sp.classList.add("own");}}
function circuitPanel(ci){
 // groups sorted by median floor, three to a row, earliest at the bottom; the word on top
 const W=330,order=ci.groups.map((g,k)=>k).sort((a,b)=>ci.groups[a].floor-ci.groups[b].floor),NR=Math.ceil(order.length/3),H=70+NR*78,gx={},rowOf={},rows=[];
 order.forEach((k,j)=>{const r=Math.floor(j/3);(rows[r]=rows[r]||[]).push(k);rowOf[k]=r;});
 rows.forEach((r,ri)=>r.forEach((k,j)=>gx[k]=[(j+.5)*W/r.length,H-30-ri*78]));
 const emx=Math.max(...ci.gedges.map(e=>Math.abs(e[2])),...ci.groups.map(g=>Math.abs(g.attr)))||1;
 const majority=g=>{const cnt={};for(const j of g.members){const x=byK.get(ci.nodes[j][0]);if(x?.cat!=null)cnt[x.cat]=(cnt[x.cat]||0)+1;}const b=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];return b?CC[+b[0]]:"#7b8780";};
 let sv=`<svg viewBox="-6 0 ${W+12} ${H}" role="img" aria-label="circuit diagram">`;
 for(const[a,b,w]of ci.gedges){if(Math.abs(w)/emx<.05)continue;const[x1,y1]=gx[a],[x2,y2]=gx[b];if(y1===undefined)continue;const up=y2<=y1;
  const ya=up?y1-19:y1+19,yb=up?y2+19:y2-19,on=S.grp==null||S.grp===a||S.grp===b;
  sv+=`<path d="M${x1},${ya} C${x1},${(ya+yb)/2} ${x2},${(ya+yb)/2} ${x2},${yb}" fill="none" stroke="${w>0?"var(--pos)":"var(--neg)"}" stroke-width="${(1+7*Math.abs(w)/emx).toFixed(1)}" opacity="${on?.75:.12}"/>`;}
 sv+=`<rect x="${W/2-70}" y="4" width="140" height="28" fill="var(--push)"/><text x="${W/2}" y="23" text-anchor="middle" font-size="13" fill="#07090b" font-family="IBM Plex Mono,monospace">“${esc(ci.word.trim()||ci.word)}” ${(ci.p*100).toFixed(0)}%</text>`;
 ci.groups.forEach((g,k)=>{if(rowOf[k]!==NR-1)return;const[x,y]=gx[k];sv+=`<path d="M${x},${y-19} L${W/2},32" stroke="${g.attr>0?"var(--pos)":"var(--neg)"}" stroke-width="${(1+7*Math.abs(g.attr)/emx).toFixed(1)}" opacity="${S.grp==null||S.grp===k?.75:.12}" fill="none"/>`;});
 const wrap=(t,n)=>{const w=t.split(" "),out=[""];for(const x of w){const c=out[out.length-1];if((c+" "+x).trim().length<=n)out[out.length-1]=(c+" "+x).trim();else if(out.length<2)out.push(x);else{out[1]=(out[1]+" "+x).slice(0,n-1)+"…";break;}}return out.map(x=>x.length>n?x.slice(0,n-1)+"…":x);};
 ci.groups.forEach((g,k)=>{const[x,y]=gx[k],n=rows[rowOf[k]].length,bw=Math.min(150,W/n-8),lines=wrap(g.name,Math.max(5,Math.floor(bw/6))),fs=bw<70?8.5:9.5;
  sv+=`<g class="gb${S.grp===k?" on":""}" data-g="${k}" tabindex="0" role="button" aria-label="${esc(g.name)}"><rect x="${x-bw/2}" y="${y-19}" width="${bw}" height="38" rx="2" fill="#0d1013" stroke="${majority(g)}" stroke-width="1.5"/>`+
   lines.map((t,i)=>`<text x="${x}" y="${y-(lines.length===2?7:1)+i*11}" text-anchor="middle" font-size="${fs}" fill="#d9dfd8" font-family="IBM Plex Mono,monospace">${esc(t)}</text>`).join("")+
   `<text x="${x}" y="${y+15}" text-anchor="middle" font-size="8" fill="#7b8780" font-family="IBM Plex Mono,monospace">${g.members.length} · ${g.attr>0?"for":"against"}</text></g>`;});
 rows.forEach((r,ri)=>{const fl=r.map(k=>ci.groups[k].floor);sv+=`<text x="-4" y="${H-30-ri*78-24}" font-size="8.5" fill="#56625b" font-family="IBM Plex Mono,monospace">floors ~${Math.min(...fl)}–${Math.max(...fl)}</text>`;});
 sv+=`</svg>`;
 let h=`<div><h3>${S.cond==="none"?"no push":esc(S.cond)+" pushed in"} · the circuit behind one word</h3><div class="big">“${vis(ci.word)}”</div><p class="note">over “${vis(ci.alt)}” by ${ci.gap.toFixed(2)} logits. ${ci.nodes.length} neurons, grouped and named by an LLM from their blind labels. Line width: how much of the choice flows along that link (activation × gradient, through attention). Click a group.</p></div><div class="circ">${sv}</div>`;
 const g=S.grp!=null?ci.groups[S.grp]:null;
 if(g){const tt=tokenTrace(ci,S.grp),toks=cond().tok,top=[...tt.src].sort((a,b)=>b[1]-a[1]).slice(0,6),tm=top[0]?.[1]||1;
  h+=`<div><h3>reads from these words</h3>${top.length?`<div class="toks">`+top.map(([p,w])=>`<code style="opacity:${(.45+.55*w/tm).toFixed(2)}">${vis(toks[p])}</code>`).join("")+`</div><p class="note">Highlighted in the transcript (yellow: where its inputs come from; dashed: where its own neurons sit). A link between different words runs through attention.</p>`:`<p class="note">All of its inputs here come from its own token.</p>`}</div>`;
  h+=`<div class="lab-btns" style="margin-bottom:6px"><button type="button" class="go" id="lesiongrp">remove these ${g.members.length} and rerun</button></div>`;h+=`<div><h3>${esc(g.name)} · ${g.members.length} neurons</h3>`+(g.ko_p!=null?`<p class="note">Remove them and P(“${vis(ci.word)}”) goes ${(ci.p*100).toFixed(0)}% → <b style="color:var(--fg)">${(g.ko_p*100).toFixed(0)}%</b>; removing as many random neurons from the same floors and tokens: ${(g.ko_ctrl*100).toFixed(0)}%.</p>`:"")+nlist(g.members.map(j=>[ci.nodes[j][0],ci.nodes[j][2]]))+`</div>`;}
 else h+=`<p class="note">Click a group to see which words it reads from.</p><div><h3>knock each group out</h3><div class="kv">`+ci.groups.map(g=>`<span>${esc(g.name)}</span><span>${g.ko_p!=null?`${(ci.p*100).toFixed(0)}% → ${(g.ko_p*100).toFixed(0)}% <span style="color:var(--dim)">(random ${(g.ko_ctrl*100).toFixed(0)}%)</span>`:"—"}</span>`).join("")+`</div></div>`;
 return h;}
function attnPanel(c){
 if(!HDS)return "";const a=c.at?.[S.tok];const t=S.tok,np=ST.prompts[S.prompt].n_prompt;let h=`<div><h3>attention · where “${vis(c.tok[t])}” looks back</h3>`;
 if(a){const srcs=attnSources(a,t).slice(0,5),mx=srcs[0]?.[1].w||1;
  h+=srcs.length?`<div class="abar">`+srcs.map(([k,v])=>{const kk=Object.entries(v.k).sort((x,y)=>y[1]-x[1])[0][0];return `<span>“${vis(tokName(c.tok[k]))}”</span><div class="b"><i style="width:${v.w/mx*100}%;background:${HCOL[kk]}"></i></div><span style="color:${HCOL[kk]}">${esc(kk)}</span>`;}).join("")+`</div>`:`<p class="note">Mostly looking at itself and the first token here.</p>`;
  const bk={};for(const[l,hh,src,w]of a[1])if(src!==t){const k=hkind(l,hh);bk[k]=(bk[k]||0)+w;}
  h+=`<p class="note">This token's ${a[1].length} biggest head moves${Object.keys(bk).length?": "+Object.entries(bk).sort((x,y)=>y[1]-x[1]).map(([k,w])=>`<span style="color:${HCOL[k]}">${esc(k)}</span>`).join(", "):""}. What a token gathers here is what the model uses to guess the ${t<np?"next word of the prompt":"next word it writes"}.</p>`;}
 else h+=`<p class="note">${S.prompt==="__mine"?"This run came back without attention (the hosted model doesn't stream it yet).":"No attention recorded for this token."}</p>`;
 const act=new Set((a?.[1]||[]).filter(x=>x[2]!==t).map(x=>x[0]+":"+x[1]));let g="";
 for(let l=NL-1;l>=0;l--)for(let hh=0;hh<NH;hh++){const k=hkind(l,hh),key=l+":"+hh,cut=S.hedits.has(key)||S.kedits.has(k);g+=`<i data-h="${key}" class="${act.has(key)?"on":""}${cut?" cut":""}" style="background:${HCOL[k]}" title="floor ${l} · head ${hh} · ${k}"></i>`;}
 const cnt={};HDS.k.forEach(x=>cnt[HK[x]]=(cnt[HK[x]]||0)+1);
 h+=`<h3 style="margin-top:8px">all ${NL*NH} heads · floor ${NL-1} at top · click one to cut it</h3><div id="hgrid" style="grid-template-columns:repeat(${NH},1fr)">${g}</div><div class="hk">`+HK.map(k=>`<span><i style="background:${HCOL[k]}"></i>${esc(k)} ${cnt[k]||0} <button type="button" data-kcut="${esc(k)}" aria-pressed="${S.kedits.has(k)}">${S.kedits.has(k)?"uncut":"cut all"}</button></span>`).join("")+`</div>`;
 h+=`<details class="note"><summary style="cursor:pointer;color:var(--fg)">What the head kinds mean</summary><p class="note" style="margin-top:6px">Each head is sorted by what it moves on ordinary web text, weighted by the size of what it carries, not raw attention. Raw attention puts ${Math.round(HDS.summary.mean_raw_sink*100)}% of its weight on the first token, but only ${Math.round(HDS.summary.mean_valueweighted_sink*100)}% of what moves comes from there. <b style="color:${HCOL.induction}">Induction</b> heads find the last time the current word appeared and bring back what followed it, which is how the model copies. Cutting all of them breaks copying (“The violet anchor hums…” came back as “The violethorium hums beneath the seven lights”), while cutting the sink heads changes nothing. <b style="color:${HCOL["previous-word"]}">Previous-word</b> heads read the word just before, <b style="color:${HCOL["recent words"]}">recent-words</b> heads the last few, <b style="color:${HCOL["focused look-back"]}">focused look-back</b> heads one earlier word further away, and <b style="color:${HCOL["broad context"]}">broad-context</b> heads spread over everything.</p></details></div>`;
 return h;}
function editsPanel(){
 if(!nEdits()&&!ST.prompts.__mine?.compare)return "";
 let h=`<div id="editsbox"><h3>lesion playground · ${nEdits()} edit${nEdits()===1?"":"s"}</h3><div class="edits">`+[...S.dedits].map(([lk,x])=>{const[l,k]=lk.split(":").map(Number),d=DIST?.floors[l][k];return `<span class="chip" style="color:${CC[CATD[d?.cat]??12]}">floor ${l}: ${esc(d?.name||"district "+k)} (${d?.n||"?"}) ${x==null?"cut":"boosted "+x+"×"}<button type="button" data-undedit="${lk}" aria-label="undo" style="all:unset;cursor:pointer">✕</button></span>`;}).join("")+[...S.edits].map(([k,x])=>{const n=byK.get(k);return `<span class="chip" style="color:${n?.cat!=null?CC[n.cat]:"var(--dim)"}">L${(k/NI)|0}·N${k%NI} ${x==null?"removed":"held at "+x+"×"}<button type="button" data-unedit="${k}" aria-label="undo" style="all:unset;cursor:pointer">✕</button></span>`;}).join("")
  +[...S.kedits].map(k=>`<span class="chip" style="color:${HCOL[k]}">every ${esc(k)} head cut (${HDS?HDS.k.filter(x=>HK[x]===k).length:"?"})<button type="button" data-unkedit="${esc(k)}" aria-label="undo" style="all:unset;cursor:pointer">✕</button></span>`).join("")
  +[...S.hedits].map(x=>{const[l,h]=x.split(":").map(Number);return `<span class="chip" style="color:${HCOL[hkind(l,h)]}">head L${l}·H${h} (${esc(hkind(l,h))}) cut<button type="button" data-unhedit="${x}" aria-label="undo" style="all:unset;cursor:pointer">✕</button></span>`;}).join("")+`</div>`;
 h+=`<div class="edits" style="margin-top:6px"><button type="button" class="go" id="rerun">rerun with these edits</button><button type="button" id="clearedits">clear</button></div>`;
 const cm=ST.prompts.__mine?.compare;
 if(cm&&S.prompt==="__mine"){h+=`<div style="margin-top:8px"><h3>before</h3><div class="cmp">${esc(cm.orig.slice(0,400))||"<em>(none)</em>"}</div>${cm.swap&&ST.prompts.__mine.swapped===0?`<p class="note" style="color:var(--pos)">Your prompt never says “${esc(S.design.sx)}”, so nothing was swapped.</p>`:""}<h3 style="margin-top:6px">after ${cm.swap?esc(cm.swap)+(cm.n>1?` + ${cm.n-1} edit${cm.n===2?"":"s"}`:""):`${cm.n} edit${cm.n===1?"":"s"}`}${S.prompt==="__mine"?"":""}</h3><div class="cmp new">${esc(replyOf("__mine",S.cond).slice(0,400))}${ST.prompts.__mine.running?"…":""}</div></div>`;}
 return h+`</div>`;}
function neuronPanel(x){
 let h=`<div><h3>layer ${x.l} · neuron ${x.n} · ${x.l<=L?"below":"above"} the push</h3><h2>${x.lab?esc(x.lab):"Not labelled yet"}</h2>${x.cat!=null?`<p class="note"><span class="chip" style="color:${CC[x.cat]}">${esc(CATS[x.cat])}</span> ${x.clr?["","no clear pattern","loose pattern","clear single idea"][x.clr]||"":""}</p>`:""}</div>`;
 if(x.ex?.length)h+=`<div><h3>strongest firings, positive pole (max ${x.mx})</h3>`+x.ex.map(p=>`<div class="ex"><em>…</em>${esc(p[0])}<b>${esc(p[1])}</b>${esc(p[2])} <em>${p[3]}</em></div>`).join("")+`</div>`;
 if(x.nx?.length)h+=`<div><h3>negative pole (min ${x.mn})</h3>`+x.nx.map(p=>`<div class="ex n"><em>…</em>${esc(p[0])}<b>${esc(p[1])}</b>${esc(p[2])} <em>${p[3]}</em></div>`).join("")+`</div>`;
 if(x.lens)h+=`<div><h3>words it writes up / down (last floors only)</h3><div class="toks">${x.lens[0].map(t=>`<code style="color:var(--pos)">${vis(t)}</code>`).join("")}${x.lens[1].map(t=>`<code style="color:var(--neg)">${vis(t)}</code>`).join("")}</div></div>`;
 const mv=x.mv?Object.keys(x.mv):[];if(mv.length)h+=`<p class="note">Among the most specific movers for: ${mv.map(esc).join(", ")}.</p>`;
 const ed=S.edits.get(x.k);
 h+=`<div><h3>try it</h3><div class="lab-btns"><button type="button" data-edit="off">${ed===null?"✓ removed":"remove it"}</button>`+["0.6","1","1.5"].map(v=>`<button type="button" data-edit="${v}">${ed===v?"✓ ":""}hold at ${v}×</button>`).join("")+`</div><p class="note" style="margin-top:4px">Edits apply at every token. Above about 1.5× the model stops making sentences.</p></div>`;
 h+=`<button type="button" id="back" style="font:inherit;font-size:11px;background:none;border:1px solid var(--line);color:var(--dim);padding:4px 10px;cursor:pointer;align-self:start">← back</button>`;return h;}

let lastKey="";
function refresh(){const key=S.view+S.prompt+S.cond+S.mode+S.tok;if(key!==lastKey){S.grp=null;lastKey=key;}controls();draw();foot();side();}
{S.prompt="describe";S.cond="none";S.mode="fires";S.filter="meaning";S.tok=ST.prompts.describe.n_prompt;}   // open on plain reading: no steering
$("#loading").remove();resize();placeCam();refresh();
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
(function loop(){if(!still&&!ptrs.size&&!S.playing){th+=.0006;placeCam();}stepMorph();easeVals();stepPulses(performance.now()/1000);stepAttn(performance.now()/1000);R.render(scene,cam);placeTags();requestAnimationFrame(loop);})();
})();
